<script type="application/json" id="unit-data">{"id":"demo-fractions-compare-g4","title":"השוואת שברים – אותו מכנה, אותו מונה – יחידה לדוגמה","subject":"מתמטיקה","grade":"ד׳","minutes":90,"created":"2026-10-05","askName":true,"intro":{"html":"\u003cp>שתי חברות קיבלו חפיסת שוקולד באותו גודל. אחת אכלה 1/3 מהחפיסה, והשנייה אכלה 1/5. מי אכלה יותר?\u003c/p>\u003cp>היום תלמדי לענות על שאלות כאלה בקלות.\u003c/p>","goals":["להשוות שני שברים עם אותו מכנה","להשוות שני שברים עם אותו מונה","להשתמש בסימנים: גדול מ־, קטן מ־, שווה","להסביר במילים שלך למה שבר אחד גדול מהשני"],"instructions":["עברי על החלקים לפי הסדר. בכל חלק יש הסבר קצר ושאלות.","אם טעית – תקבלי רמז ותוכלי לנסות שוב.","מותר ורצוי לצייר שברים על דף בעיפרון.","בסוף תמלאי כרטיס יציאה ותראי מסך סיכום."]},"sections":[{"title":"חלק 1: נזכרות – מה זה שבר?","minutes":10,"items":[{"type":"text","html":"\u003cp>שבר מראה \u003cstrong>חלק משלם\u003c/strong>. מחלקים שלם לחלקים \u003cstrong>שווים\u003c/strong>, ולוקחים כמה מהם.\u003c/p>\u003cp>במחברת כותבים שבר כך: מספר למעלה, קו, ומספר למטה. כאן במחשב נכתוב אותו בשורה אחת: 3/4 = שלושה רבעים.\u003c/p>"},{"type":"tip","html":"\u003cp>כך נראה 3/4 בפס. הפס מחולק ל-4 חלקים שווים, ו-3 מהם צבועים:\u003c/p>\u003cp>🟦🟦🟦⬜\u003c/p>"},{"type":"text","html":"\u003cp>\u003cstrong>המכנה\u003c/strong> הוא המספר למטה (או אחרי הקו). הוא אומר לכמה חלקים שווים חילקנו את השלם.\u003c/p>\u003cp>\u003cstrong>המונה\u003c/strong> הוא המספר למעלה (או לפני הקו). הוא אומר כמה חלקים לקחנו.\u003c/p>"},{"type":"mcq","prompt":"בשבר 2/5, מה המכנה?","options":["2","5","7"],"answer":1,"feedback":{"0":"2 הוא המונה – כמה חלקים לקחנו.","2":"7 זה 2 ועוד 5. המכנה הוא אחד המספרים שבשבר."},"hint":"המכנה אומר לכמה חלקים חילקנו את השלם.","explain":"המכנה הוא 5: השלם חולק ל-5 חלקים שווים. המונה הוא 2: לקחנו 2 חלקים."},{"type":"mcq","prompt":"איזה חלק מהפס צבוע?  🟩🟩⬜⬜⬜","options":["2/3","3/5","2/5"],"answer":2,"feedback":{"0":"המכנה הוא מספר כל החלקים בפס – גם הצבועים וגם הלבנים.","1":"3/5 הם החלקים הלבנים. השאלה היא על החלקים הצבועים."},"hint":"ספרי: כמה חלקים יש בכל הפס? כמה מהם צבועים?","explain":"בפס יש 5 חלקים שווים, ו-2 מהם צבועים. לכן 2/5 מהפס צבוע."},{"type":"fill","prompt":"בשבר 7/8, מה המונה? (כתבי מספר)","accept":["7","שבע","שבעה"],"hint":"המונה אומר כמה חלקים לקחנו.","explain":"המונה הוא 7: לקחנו 7 חלקים מתוך 8 חלקים שווים."}]},{"title":"חלק 2: אותו מכנה","minutes":14,"items":[{"type":"text","html":"\u003cp>כשלשני שברים יש \u003cstrong>אותו מכנה\u003c/strong>, השלם חולק לאותו מספר חלקים. לכן כל החלקים באותו גודל.\u003c/p>\u003cp>אז רק סופרים חלקים: השבר עם \u003cstrong>המונה הגדול יותר\u003c/strong> הוא השבר הגדול יותר.\u003c/p>"},{"type":"tip","html":"\u003cp>3/5 🟦🟦🟦⬜⬜\u003c/p>\u003cp>2/5 🟦🟦⬜⬜⬜\u003c/p>\u003cp>ב-3/5 צבועים יותר חלקים, לכן 3/5 גדול מ-2/5.\u003c/p>"},{"type":"mcq","prompt":"איזה שבר גדול יותר: 4/9 או 7/9?","options":["4/9","7/9","הם שווים"],"answer":1,"feedback":{"0":"המכנה שווה, אז בודקים את המונה. 4 קטן מ-7.","2":"המכנים שווים, אבל המונים שונים – לכן השברים לא שווים."},"hint":"המכנה זהה. למי יש יותר חלקים?","explain":"לשני השברים אותו מכנה (9), אז החלקים באותו גודל. ב-7/9 יש 7 חלקים וב-4/9 רק 4, לכן 7/9 גדול יותר."},{"type":"tf","prompt":"1/6 גדול מ-5/6.","answer":false,"hint":"המכנה זהה. השווי את המונים.","explain":"המכנה זהה (6), אז משווים מונים: 1 קטן מ-5. לכן 1/6 קטן מ-5/6."},{"type":"mcq","prompt":"סדרי מהקטן אל הגדול: 5/12, 1/12, 9/12","options":["קודם 9/12, אחריו 5/12, ובסוף 1/12","קודם 1/12, אחריו 5/12, ובסוף 9/12","קודם 5/12, אחריו 1/12, ובסוף 9/12"],"answer":1,"feedback":{"0":"זה הסדר מהגדול אל הקטן. התחילי מהשבר עם המונה הכי קטן."},"hint":"לכולם אותו מכנה. התחילי מהשבר עם הכי מעט חלקים.","explain":"המכנה זהה (12), אז מסדרים לפי המונה: 1, 5, 9. לכן הסדר הוא 1/12, ואחריו 5/12, ואחריו 9/12."},{"type":"fill","prompt":"דנה קראה 2/8 מהספר. נועה קראה 5/8 מאותו ספר. מי קראה יותר? (כתבי את השם)","accept":["נועה","נועה קראה יותר"],"hint":"לשני השברים אותו מכנה. למי המונה גדול יותר?","explain":"המכנה זהה (8), ו-5 גדול מ-2. לכן נועה קראה יותר."}]},{"title":"חלק 3: אותו מונה","minutes":16,"items":[{"type":"text","html":"\u003cp>עכשיו לשני השברים יש \u003cstrong>אותו מונה\u003c/strong>, אבל מכנה שונה. למשל 1/3 ו-1/6.\u003c/p>\u003cp>חשבי על פיצה. אם מחלקים אותה ל-3, כל משולש גדול. אם מחלקים אותה ל-6, כל משולש קטן יותר.\u003c/p>"},{"type":"video","youtube":"kRk6zeypJWM","caption":"אם יש לך אוזניות – צפי בסרטון. שימי לב: מה קורה לגודל של כל חלק כשהמכנה גדל? אם אין אוזניות – אפשר לדלג, ההסבר כתוב גם כאן למטה."},{"type":"text","html":"\u003cp>הכלל: כשהמונה זהה, השבר עם \u003cstrong>המכנה הקטן יותר\u003c/strong> הוא השבר הגדול יותר.\u003c/p>\u003cp>למה? מכנה קטן = מחלקים לפחות חלקים = כל חלק גדול יותר.\u003c/p>"},{"type":"tip","html":"טריק לזכירה: ככל שיותר חברות חולקות את אותה פיצה, כל אחת מקבלת חתיכה קטנה יותר."},{"type":"mcq","prompt":"איזה שבר גדול יותר: 1/8 או 1/4?","options":["1/4","1/8","הם שווים"],"answer":0,"feedback":{"1":"זו טעות נפוצה! 8 גדול מ-4, אבל כשמחלקים ל-8, כל חלק קטן יותר.","2":"המונה זהה, אבל החלקים בגודל שונה – לכן השברים לא שווים."},"hint":"לכמה חלקים מחלקים את השלם בכל שבר? איפה החלקים גדולים יותר?","explain":"המונה זהה (1). ב-1/4 מחלקים לפחות חלקים, אז כל חלק גדול יותר. לכן 1/4 גדול מ-1/8."},{"type":"tf","prompt":"3/8 גדול מ-3/5.","answer":false,"hint":"המונים שווים. איזה מכנה קטן יותר?","explain":"המונה זהה (3). ל-3/5 יש מכנה קטן יותר, לכן כל חלק שלו גדול יותר. לכן 3/5 גדול מ-3/8 – והמשפט לא נכון."},{"type":"mcq","prompt":"רותם אכלה 2/3 מחפיסת שוקולד. שירה אכלה 2/7 מחפיסה באותו גודל. מי אכלה יותר?","options":["שירה, כי 7 גדול מ-3","רותם, כי החלקים שלה גדולים יותר","אכלו אותה כמות, כי שתיהן אכלו 2 חלקים"],"answer":1,"feedback":{"0":"זו הטעות הנפוצה! מכנה גדול אומר שהחלקים קטנים יותר.","2":"נכון ששתיהן אכלו 2 חלקים, אבל החלקים לא באותו גודל."},"hint":"לשתיהן 2 חלקים. של מי החלקים גדולים יותר?","explain":"המונה זהה (2). את החפיסה של רותם חילקו ל-3 בלבד, אז כל חלק גדול יותר. לכן 2/3 גדול מ-2/7, ורותם אכלה יותר."},{"type":"open","prompt":"מיכל אומרת: 1/10 גדול מ-1/2, כי 10 גדול מ-2. האם מיכל צודקת? הסבי
