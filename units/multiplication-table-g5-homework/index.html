<script type="application/json" id="unit-data">{"id":"multiplication-table-g5-homework","title":"מבצע מסיבת סוף השנה – לוח הכפל","subject":"מתמטיקה","grade":"ה׳","minutes":35,"created":"2026-10-11","askName":true,"audience":"mixed","intro":{"html":"\u003cp>למה בכלל ללמוד כפל? נועה, מוועדת המסיבה של השכבה, מתכננת את מסיבת סוף השנה. צריך לדעת כמה כיסאות לסדר, כמה כיבוד לקנות ואם הכסף מספיק. אפשר לספור הכול אחד-אחד… או להשתמש בכפל.\u003c/p>\u003cp>היום אתם עוזרים לנועה. בכל משימה תגלו טריק שהופך את החישוב לקל, ותסמנו וי ברשימת ההכנות.\u003c/p>","goals":["להשתמש בכפל כדי לתכנן ולחשב דברים אמיתיים","להשתמש בטריקים כדי למצוא תוצאה בלוח הכפל","לפתור בעיות מהחיים בעזרת כפל"]},"sections":[{"title":"משימה 1: הושבה באולם","minutes":7,"items":[{"type":"image","src":"media/noa.svg","alt":"ילדה עם כובע מסיבה ולוח רשימות מנופפת לשלום, ולידה בלונים","caption":"נועה, מוועדת המסיבה","credit":"איור מקורי"},{"type":"text","html":"\u003cp>שלום! אני נועה, ואני אחראית על מסיבת סוף השנה. ברשימת ההכנות שלי יש ארבע משימות, ואני צריכה עזרה. מתחילים באולם: מסדרים כיסאות בשורות. הנה פינה קטנה של האולם.\u003c/p>"},{"type":"image","src":"media/array-3x4.svg","alt":"שלוש שורות של כיסאות ירוקים, בכל שורה ארבעה כיסאות","caption":"פינה באולם","credit":"איור מקורי"},{"type":"fill","prompt":"כמה כיסאות יש באיור? (כתבו מספר)","accept":["12","שתים עשרה","שתים-עשרה","שנים עשר"],"hint":"ספרו שורה אחר שורה: 4, 8, …","explain":"3 שורות של 4 כיסאות: 12. בכפל כותבים ⁦3 × 4 = 12⁩."},{"type":"text","html":"\u003cp>עכשיו סידרו את אותה פינה אחרת:\u003c/p>"},{"type":"image","src":"media/array-4x3.svg","alt":"ארבע שורות של כיסאות ירוקים, בכל שורה שלושה כיסאות","caption":"אותה פינה, סידור אחר","credit":"איור מקורי"},{"type":"fill","prompt":"וכמה כיסאות יש עכשיו? (כתבו מספר)","accept":["12","שתים עשרה","שתים-עשרה","שנים עשר"],"hint":"4 שורות של 3: 3, 6, …","explain":"שוב 12: ⁦4 × 3 = 12⁩."},{"type":"text","html":"\u003cp>שמתם לב? ⁦3 × 4⁩ ו-⁦4 × 3⁩ נותנים אותו דבר, כי אלה אותם כיסאות, רק בסידור אחר. \u003cstrong>בכפל הסדר לא משנה.\u003c/strong> לכלל הזה קוראים \u003cstrong>חוק החילוף\u003c/strong>. מי שיודע אחד מהם, יודע גם את השני.\u003c/p>"},{"type":"mcq","prompt":"יואב מציע לסדר 9 שורות של 6 כיסאות. מאיה מציעה 6 שורות של 9 כיסאות. באיזה סידור יש יותר כיסאות?","options":["בסידור של יואב","בשני הסידורים אותו מספר","בסידור של מאיה"],"answer":1,"feedback":{"0":"נסו לסובב את הסידור של יואב – מה מקבלים?","2":"נסו לסובב את הסידור של מאיה – מה מקבלים?"},"hint":"זכרו: הסדר בכפל לא משנה.","explain":"⁦9 × 6 = 6 × 9 = 54⁩: בשני הסידורים 54 כיסאות."},{"type":"text","html":"\u003cp>ליד הבמה יש 3 שורות של 6 כיסאות: בכל שורה 4 ירוקים ו-2 כתומים.\u003c/p>"},{"type":"image","src":"media/chairs-3x6-split.svg","alt":"שלוש שורות של שישה כיסאות; בכל שורה ארבעה כיסאות ירוקים ושניים כתומים","caption":"ליד הבמה","credit":"איור מקורי"},{"type":"fill","prompt":"כמה כיסאות ירוקים יש? (כתבו מספר)","accept":["12","שתים עשרה","שתים-עשרה","שנים עשר"],"hint":"3 שורות של 4 ירוקים.","explain":"3 שורות של 4: ⁦3 × 4 = 12⁩."},{"type":"fill","prompt":"כמה כיסאות כתומים יש? (כתבו מספר)","accept":["6","שש","שישה"],"hint":"3 שורות של 2 כתומים.","explain":"3 שורות של 2: ⁦3 × 2 = 6⁩."},{"type":"fill","prompt":"כמה כיסאות יש ליד הבמה בסך הכול? (כתבו מספר)","accept":["18","שמונה עשרה","שמונה-עשרה","שמונה עשר"],"hint":"חברו את הירוקים והכתומים.","explain":"12 ועוד 6 הם 18. כלומר ⁦3 × 6 = 18⁩."},{"type":"text","html":"\u003cp>מה עשיתם כאן? מצאתם את ⁦3 × 6⁩ בעזרת שני תרגילים קלים: ⁦3 × 4⁩ ו-⁦3 × 2⁩. זה הטריק השני: \u003cstrong>פירוק\u003c/strong>. כשתרגיל קשה, מפרקים אותו לשני תרגילים קלים ומחברים. במתמטיקה הכלל הזה נקרא \u003cstrong>חוק הפילוג\u003c/strong>.\u003c/p>"},{"type":"fill","prompt":"ליד הכניסה יש 5 שורות של 7 כיסאות. פרקו את 7 ל-5 ול-2: כמה כיסאות יש? (כתבו מספר)","accept":["35","שלושים וחמש","שלושים וחמישה"],"hint":"5 × 5 ועוד 5 × 2.","explain":"⁦5 × 5 = 25⁩ ו-⁦5 × 2 = 10⁩. ביחד 35 כיסאות."},{"type":"fill","prompt":"נועה הוסיפה ליד הכניסה עוד שורה של 7 כיסאות. עכשיו יש 6 שורות של 7. כמה כיסאות יש? (כתבו מספר)","accept":["42","ארבעים ושתיים","ארבעים ושניים"],"hint":"היו 35 כיסאות, ונוספה עוד שורה אחת של 7.","explain":"35 ועוד 7 הם 42. כלומר ⁦6 × 7 = 42⁩. עוד טריק: מי שיודע תרגיל קרוב, כמו ⁦5 × 7⁩, מוסיף עוד קבוצה אחת."},{"type":"fill","prompt":"נועה קיבלה עוד 20 כיסאות, והיא רוצה לסדר אותם בשורות של 4. כמה שורות יהיו? (כתבו מספר)","accept":["5","חמש","חמישה"],"hint":"איזה מספר כפול 4 נותן 20?","explain":"⁦5 × 4 = 20⁩, לכן 5 שורות."},{"type":"image","src":"media/checklist-1.svg","alt":"נועה ליד רשימת ההכנות: ליד הכיסאות יש וי, ושלוש משימות עוד מחכות","caption":"רשימת ההכנות של נועה","credit":"איור מקורי"},{"type":"text","html":"\u003cp>וי ראשון! ההושבה מוכנה, וגיליתם בדרך שני טריקים: חוק החילוף והפירוק. עכשיו הכיבוד.\u003c/p>"}]},{"title":"משימה 2: הכיבוד","minutes":7,"items":[{"type":"text","html":"\u003cp>עכשיו קונים כיבוד. הנה קופסת הסוכריות: 7 שורות, ובכל שורה 5 סוכריות ירוקות ו-3 כתומות.\u003c/p>"},{"type":"image","src":"media/candies-7x8-split.svg","alt":"קופסה עם שבע שורות של שמונה סוכריות; בכל שורה חמש סוכריות ירוקות ושלוש כתומות","caption":"קופסת הסוכריות","credit":"איור מקורי"},{"type":"fill","prompt":"כמה סוכריות ירוקות יש? (כתבו מספר)","accept":["35","שלושים וחמש","שלושים וחמישה"],"hint":"7 שורות של 5.","explain":"⁦7 × 5 = 35⁩."},{"type":"fill","prompt":"כמה סוכריות כתומות יש? (כתבו מספר)","accept":["21","עשרים ואחת","עשרים ואחד"],"hint":"7 שורות של 3.","explain":"⁦7 × 3 = 21⁩."},{"type":"fill","prompt":"כמה סוכריות יש בקופסה? (כתבו מספר)","accept":["56","חמישים ושש","חמישים ושישה"],"hint":"חברו את הירוקות והכתומות.","explain":"35 ועוד 21 הם 56. בעזרת פירוק מצאתם ש-⁦7 × 8 = 56⁩."},{"type":"text","html":"\u003cp>דנה, חברה בוועדה, חישבה קופסה כזאת וכתבה:\u003c/p>\u003cp>⁦7 × 5 = 35⁩\u003cbr>⁦35 + 3 = 38⁩\u003c/p>\u003cp>היא קיבלה 38, ולא 56. הסתכלו שוב בקופסה.\u003c/p>"},{"type":"image","src":"media/candies-7x8-split.svg","alt":"קופסה עם שבע שורות של שמונה סוכריות; בכל שורה חמש סוכריות ירוקות ושלוש כתומות","caption":"הקופסה שדנה חישבה","credit":"איור מקורי"},{"type":"mcq","prompt":"איפה דנה טעתה?","options":["היא טעתה ב-⁦7 × 5⁩","היא הייתה צריכה לפרק ל-4 ול-4","היא שכחה שיש 3 סוכריות כתומות בכל אחת מ-7 השורות"],"answer":2,"feedback":{"0":"⁦7 × 5 = 35⁩ נכון: 7 שורות של 5 סוכריות ירוקות.","1":"גם פירוק ל-4 ול-4 עובד, אבל הטעות של דנה במקום אחר. כמה סוכריות כתומות יש באיור?"},"hint":"ספרו באיור: כמה סוכריות כתומות יש בקופסה?","explain":"יש 7 שורות של 3 סוכריות כתומות, כלומר ⁦7 × 3 = 21⁩, ולא 3. זו הטעות הנפוצה בפירוק: מכפילים רק את החלק הראשון. ⁦35 + 21 = 56⁩."},{"type":"text","html":"\u003cp>עכשיו פיצות. על כל מגש 4 פיצות. הנה המגשים, וכמה פיצות יש בכל פעם:\u003c/p>\u003cp>1 מגש: 4 פיצות\u003cbr>2 מגשים: 8 פיצות\u003cbr>4 מגשים: 16 פיצות\u003cbr>8 מגשים: 32 פיצות\u003c/p>"},{"type":"image","src":"media/pizza-trays.svg","alt":"מגשי פיצה בארבע שורות: מגש אחד, 2 מגשים, 4 מגשים ו-8 מגשים; על כל מגש ארבע פיצות","caption":"מגשי הפיצה","credit":"איור מקורי"},{"type":"mcq","prompt":"מה קורה למספר הפיצות כשמספר המגשים גדל פי 2?","options":["הוא גדל בעוד 4","הוא גדל פי 2","הוא לא משתנה"],"answer":1,"feedback":{"0":"מ-2 מגשים ל-4 מגשים הפיצות עולות מ-8 ל-16 – זה יותר מעוד 4.","2":"השוו: 8 פיצות ב-2 מגשים, 16 פיצות ב-4 מגשים."},"hint":"השוו בין 2 מגשים ל-4 מגשים, ובין 4 ל-8.","explain":"כשהמגשים גדלים פי 2, גם הפיצות גדלות פי 2: 8, אחריו 16, אחריו 32."},{"type":"text","html":"\u003cp>זה הטריק השלישי: \u003cstrong>הכפלה\u003c/strong>. כפול 4 זה להכפיל פעמיים, וכפול 8 זה להכפיל שלוש פעמים. למשל ⁦8 × 6⁩: קודם 6, אחריו 12, אחריו 24, ובסוף 48.\u003c/p>"},{"type":"fill","prompt":"בחבילת עוגיות יש 4 עוגיות. קניתם 9 חבילות. כמה עוגיות קניתם? הכפילו פעמיים. (כתבו מספר)","accept":["36","שלושים ושש","שלושים ושישה"],"hint":"9, אחריו 18, …","explain":"9, אחריו 18, ובסוף 36. לכן ⁦4 × 9 = 36⁩."},{"type":"mcq","prompt":"צריך 54 בקבוקי שתייה. השתייה נמכרת בארגזים של 6 בקבוקים. כמה ארגזים צריך לקנות?","options":["6","8","48","9"],"answer":3,"feedback":{"1":"8 ארגזים הם ⁦8 × 6 = 48⁩ בקבוקים – לא מספיק.","2":"48 הוא מספר בקבוקים, לא מספר ארגזים."},"hint":"איזה מספר כפול 6 נותן 54?","explain":"⁦9 × 6 = 54⁩: תשעה ארגזים של 6 הם בדיוק 54 בקבוקים."},{"type":"image","src":"media/checklist-2.svg","alt":"נועה ליד רשימת ההכנות: ליד הכיסאות וליד הסוכריות יש וי","caption":"רשימת ההכנות של נועה","credit":"איור מקורי"},{"type":"text","html":"\u003cp>וי שני! הכיבוד מוכן, ונוסף לכם טריק שלישי: הכפלה. עכשיו פינת המשחקים.\u003c/p>"}]},{"title":"משימה 3: פינת המשחקים","minutes":7,"items":[{"type":"image","src":"media/basket.svg","alt":"נועה זורקת כדור כתום אל סל כדורסל","caption":"פינת הקליעה לסל","credit":"איור מקורי"},{"type":"text","html":"\u003cp>בפינת המשחקים כל קליעה לסל שווה 9 נקודות. הנה טבלת הניקוד:\u003c/p>\u003cp>קליעה אחת: 9\u003cbr>2 קליעות: 18\u003cbr>3 קליעות: 27\u003cbr>4 קליעות: 36\u003cbr>5 קליעות: 45\u003c/p>\u003cp>הסתכלו טוב על התוצאות. משהו מסתתר שם.\u003c/p>"},{"type":"mcq","prompt":"מה משותף לכל התוצאות בטבלה?","options":["סכום הספרות בכל תוצאה הוא 9","כולן מספרים זוגיים","כולן נגמרות ב-9"],"answer":0,"feedback":{"1":"27 ו-45 הם מספרים אי-זוגיים.","2":"18 נגמר ב-8, ו-27 נגמר ב-7."},"hint":"חברו את הספרות בכל מספר: 1 ועוד 8, 2 ועוד 7…","explain":"1 ועוד 8 הם 9, 2 ועוד 7 הם 9, 3 ועוד 6 הם 9 – וכך בכל התוצאות."},{"type":"text","html":"\u003cp>למה זה עובד? נועה מציעה לחשוב כך: 9 זה 1 פחות מ-10.\u003c/p>"},{"type":"fill","prompt":"אילו כל קליעה הייתה שווה 10 נקודות, כמה נקודות היו נותנות 6 קליעות? (כתבו מספר)","accept":["60","שישים"],"hint":"כפול 10 זה קל: מוסיפים 0.","explain":"⁦6 × 10 = 60⁩."},{"type":"fill","prompt":"אבל כל קליעה שווה 9, כלומר נקודה אחת פחות. מ-60 מורידים נקודה על כל אחת מ-6 הקליעות. כמה נקודות נותנות 6 קליעות? (כתבו מספר)","accept":["54","חמישים וארבע","חמישים וארבעה"],"hint":"60 פחות 6.","explain":"60 פחות 6 הם 54. כלומר ⁦9 × 6 = 54⁩: כופלים ב-10 ומורידים קבוצה אחת."},{"type":"tip","html":"\u003cp>\u003cstrong>טריק ה-9:\u003c/strong> בתוצאה של 9 כפול מספר, ספרת העשרות קטנה ב-1 מהמספר, וסכום הספרות הוא 9. למשל ⁦9 × 6⁩: העשרות הן 5, ו-5 ועוד 4 הם 9 – לכן 54.\u003c/p>"},{"type":"text","html":"\u003cp>ויש טריק שעושים עם הידיים. פורשים את עשר האצבעות, כפות הידיים מולכם. כדי למצוא את ⁦9 × 4⁩ מכופפים את האצבע הרביעית משמאל. משמאל לה נשארות 3 אצבעות: אלה העשרות. מימין לה נשארות 6 אצבעות: אלה האחדות. לכן ⁦9 × 4 = 36⁩.\u003c/p>"},{"type":"image","src":"media/fingers-9x4.svg","alt":"עשר אצבעות פרושות; האצבע הרביעית משמאל מכופפת. משמאל לה שלוש אצבעות, ומימין לה שש","caption":"טריק האצבעות ל-⁦9 × 4⁩","credit":"איור מקורי"},{"type":"fill","prompt":"נסו בעצמכם: כופפו את האצבע השמינית משמאל. כמה זה ⁦9 × 8⁩? (כתבו מספר)","accept":["72","שבעים ושתיים","שבעים ושניים"],"hint":"כמה אצבעות יש משמאל לאצבע המכופפת, וכמה מימין?","explain":"משמאל 7 אצבעות ומימין 2: ⁦9 × 8 = 72⁩."},{"type":"fill","prompt":"דנה צברה 81 נקודות. כמה פעמים היא קלעה? (כתבו מספר)","accept":["9","תשע","תשעה"],"hint":"איזה מספר כפול 9 נותן 81? העשרות הן 8, אז המספר גדול ב-1 מ-8.","explain":"⁦9 × 9 = 81⁩: דנה קלעה 9 פעמים."},{"type":"text","html":"\u003cp>עכשיו יש לכם שלושה טריקים: פירוק, הכפלה וטריק ה-9. לכל תרגיל מתאים טריק אחר.\u003c/p>"},{"type":"mcq","prompt":"מה הדרך הכי מהירה למצוא את ⁦9 × 7⁩?","options":["הכפלה","טריק ה-9","לספור אחד-אחד"],"answer":1,"feedback":{"0":"הכפלה עובדת טוב בכפול 4 ובכפול 8. כאן יש 9.","2":"אפשר, אבל זה ארוך. כשיש 9, יש טריק מהיר."},"hint":"איזה מספר מופיע בתרגיל?","explain":"כשיש 9 בתרגיל, טריק ה-9 הכי מהיר: העשרות 6, ו-6 ועוד 3 הם 9, לכן 63. אפשר גם בידיים, או ⁦70 פחות 7⁩."},{"type":"mcq","prompt":"ומה הדרך הכי מהירה למצוא את ⁦4 × 7⁩?","options":["טריק ה-9","לספור אחד-אחד","הכפלה"],"answer":2,"feedback":{"0":"טריק ה-9 מתאים רק כשכופלים ב-9.","1":"אפשר, אבל זה ארוך. כפול 4 יש טריק מהיר."},"hint":"כפול 4 זה להכפיל…","explain":"כפול 4 זה להכפיל פעמיים: 7, אחריו 14, ובסוף 28."},{"type":"image","src":"media/checklist-3.svg","alt":"נועה ליד רשימת ההכנות: שלוש משימות מסומנות בווי, ונשאר רק התקציב","caption":"רשימת ההכנות של נועה","credit":"איור מקורי"},{"type":"text","html":"\u003cp>וי שלישי! פינת המשחקים מוכנה. נשארה משימה אחת.\u003c/p>"}]},{"title":"משימה 4: התקציב","minutes":6,"items":[{"type":"image","src":"media/shopping.svg","alt":"חבילת בלונים, ארגז בקבוקי שתייה וערימת צלחות, ומתחת לכל אחד מטבע","caption":"רשימת הקניות","credit":"איור מקורי"},{"type":"text","html":"\u003cp>משימה אחרונה: לבדוק שהכסף מספיק. לוועדה יש 150 שקלים, וזה מה שצריך לקנות:\u003c/p>\u003cp>9 חבילות בלונים, כל חבילה 5 שקלים\u003cbr>9 ארגזי שתייה (מצאתם שצריך 9), כל ארגז 7 שקלים\u003cbr>8 חבילות צלחות, כל חבילה 6 שקלים\u003c/p>"},{"type":"fill","prompt":"כמה עולים הבלונים? (כתבו מספר)","accept":["45","ארבעים וחמש","ארבעים וחמישה"],"hint":"9 חבילות, כל אחת 5 שקלים.","explain":"⁦9 × 5 = 45⁩ שקלים."},{"type":"fill","prompt":"כמה עולה השתייה? (כתבו מספר)","accept":["63","שישים ושלוש","שישים ושלושה"],"hint":"9 ארגזים: טריק ה-9 יעזור.","explain":"⁦9 × 7 = 63⁩ שקלים."},{"type":"fill","prompt":"כמה עולות הצלחות? (כתבו מספר)","accept":["48","ארבעים ושמונה"],"hint":"כפול 8 זה להכפיל שלוש פעמים: 6, 12, …","explain":"6, אחריו 12, אחריו 24, ובסוף 48. כלומר ⁦8 × 6 = 48⁩ שקלים."},{"type":"fill","prompt":"כמה עולה הכול ביחד? (כתבו מספר)","accept":["156","מאה חמישים ושש","מאה חמישים ושישה"],"hint":"חברו: 45 ועוד 63 ועוד 48.","explain":"⁦45 + 63 = 108⁩, ועוד 48 הם 156 שקלים."},{"type":"tf","prompt":"150 השקלים של הוועדה מספיקים לכל הקניות.","answer":false,"hint":"השוו את הסכום שמצאתם ל-150.","explain":"הקניות עולות 156 שקלים: 6 שקלים יותר מ-150."},{"type":"open","prompt":"חסרים 6 שקלים. מה הייתם משנים ברשימה כדי שהכסף יספיק? כתבו את השינוי ואת החשבון החדש.","hint":"כמה חוסכים אם קונים חבילה אחת פחות מאחד הדברים? ושימו לב: צריך מספיק שתייה לכולם.","model":"מוותרים על חבילת צלחות אחת: ⁦7 × 6 = 42⁩ במקום 48, כלומר חוסכים 6 שקלים, וסך הכול 150 בדיוק. ויתור על חבילת בלונים חוסך רק 5 שקלים, ובלי ארגז שתייה לא יהיו מספיק בקבוקים."},{"type":"image","src":"media/checklist-4.svg","alt":"נועה מנופפת ליד רשימת ההכנות: כל ארבע המשימות מסומנות בווי","caption":"רשימת ההכנות של נועה","credit":"איור מקורי"},{"type":"text","html":"\u003cp>כל הרשימה מסומנת! המסיבה מוכנה. תודה על העזרה – בלעדיכם זה לא היה מצליח. נשאר כרטיס היציאה, ולמי שרוצה: אתגר.\u003c/p>"}]}],"exit":{"prompts":["איפה עוד בחיים שלכם צריך כפל? תנו דוגמה אחת.","איזה תרגיל בלוח הכפל עדיין קשה לכם?"],"selfRating":true},"enrichment":{"title":"אתגר: סידור מושלם","items":[{"type":"text","html":"\u003cp>חידה: נועה סידרה סוכריות בארבעה מגשים. איזה מגש לא שייך לשאר? יש יותר מתשובה נכונה אחת.\u003c/p>"},{"type":"image","src":"media/wodb-arrays.svg","alt":"ארבעה מגשים של סוכריות: מגש 1 – 3 שורות של 8; מגש 2 – 4 שורות של 6; מגש 3 – 2 שורות של 12; מגש 4 – 5 שורות של 5","caption":"ארבעת המגשים","credit":"איור מקורי"},{"type":"open","prompt":"בחרו מגש אחד שלא שייך לשאר, והסבירו למה. אתגר: מצאו סיבה לכל אחד מארבעת המגשים.","hint":"כמה סוכריות יש בכל מגש? כמה שורות? כמה בכל שורה?","model":"מגש 4: היחיד שאין בו 24 סוכריות (⁦5 × 5 = 25⁩), והיחיד שמספר השורות בו שווה למספר הסוכריות בשורה. מגש 3: היחיד שיש בו יותר מ-10 סוכריות בשורה. מגש 1: היחיד עם 3 שורות. מגש 2: היחיד עם 4 שורות, ובכל שורה בו רק 2 סוכריות יותר ממספר השורות."},{"type":"mcq","prompt":"רוצים לסדר 24 תלמידים בשורות שוות, בלי מקומות ריקים. איזה סידור לא אפשרי?","options":["3 שורות של 8","4 שורות של 6","5 שורות של 5"],"answer":2,"feedback":{"0":"⁦3 × 8 = 24⁩ – זה סידור אפשרי.","1":"⁦4 × 6 = 24⁩ – זה סידור אפשרי."},"hint":"בדקו כל סידור: כמה תלמידים הוא מושיב?","explain":"⁦5 × 5 = 25⁩, לא 24 – יהיה מקום ריק אחד."},{"type":"open","prompt":"מצאו עוד שני סידורים של 24 תלמידים בשורות שוות, בלי מקומות ריקים. כתבו אותם כתרגילי כפל.","hint":"איזה מספרים כפול משהו נותנים 24?","model":"למשל: 2 שורות של 12 (⁦2 × 12 = 24⁩), ושורה אחת של 24 (⁦1 × 24 = 24⁩). גם 6 שורות של 4 ו-8 שורות של 3 מתאימות."}]},"summaryInstruction":"לחצו על ׳העתקת הסיכום כטקסט׳ ושלחו למורה, או צלמו את המסך ושלחו למורה."}</script>
