<script type="application/json" id="unit-data">{"id":"multiplication-table-g5-homework","title":"מבצע מסיבת סוף השנה – לוח הכפל","subject":"מתמטיקה","grade":"ה׳","minutes":25,"created":"2026-10-11","askName":true,"audience":"mixed","intro":{"html":"\u003cp>למה בכלל ללמוד כפל? דמיינו שאתם צוות התכנון של מסיבת סוף השנה של כל השכבה. צריך לדעת כמה כיסאות לסדר, כמה עוגיות לקנות ואם הכסף מספיק. אפשר לספור הכול אחד-אחד… או להשתמש בכפל.\u003c/p>\u003cp>היום אתם הצוות. בכל משימה תגלו טריק שהופך את החישוב לקל.\u003c/p>","goals":["להשתמש בכפל כדי לתכנן ולחשב דברים אמיתיים","להשתמש בטריקים כדי למצוא תוצאה בלוח הכפל","לפתור בעיות מהחיים בעזרת כפל"]},"sections":[{"title":"משימה 1: הושבה באולם","minutes":5,"items":[{"type":"text","html":"\u003cp>באולם מסדרים כיסאות \u003cstrong>בשורות שוות\u003c/strong>. כפל הוא דרך מהירה לספור אותם: ⁦3 × 4⁩ הוא 3 שורות, ובכל שורה 4 כיסאות.\u003c/p>"},{"type":"image","src":"media/array-3x4.svg","alt":"שלוש שורות של כיסאות ירוקים, בכל שורה ארבעה כיסאות","caption":"3 שורות של 4 כיסאות","credit":"איור מקורי"},{"type":"fill","prompt":"כמה כיסאות יש באיור? (כתבו מספר)","accept":["12","שתים עשרה","שתים-עשרה","שנים עשר"],"hint":"אפשר לספור שורה אחר שורה: 4, 8, …","explain":"3 שורות של 4 כיסאות: ⁦3 × 4 = 12⁩."},{"type":"text","html":"\u003cp>\u003cstrong>הסדר לא משנה:\u003c/strong> אם מסובבים את הסידור, מקבלים 4 שורות של 3 – אותם כיסאות בדיוק. לכן ⁦3 × 4 = 4 × 3⁩. מי שיודע אחד מהם, יודע גם את השני.\u003c/p>"},{"type":"image","src":"media/array-4x3.svg","alt":"ארבע שורות של כיסאות ירוקים, בכל שורה שלושה כיסאות","caption":"אותם 12 כיסאות: 4 שורות של 3","credit":"איור מקורי"},{"type":"mcq","prompt":"המורה מציעה לסדר 9 שורות של 6 כיסאות. נועה מציעה 6 שורות של 9 כיסאות. באיזה סידור יש יותר כיסאות?","options":["בסידור של המורה","בשני הסידורים אותו מספר","בסידור של נועה"],"answer":1,"feedback":{"0":"נסו לסובב את הסידור של המורה – מה מקבלים?","2":"נסו לסובב את הסידור של נועה – מה מקבלים?"},"hint":"זכרו: הסדר בכפל לא משנה.","explain":"⁦9 × 6 = 6 × 9 = 54⁩: בשני הסידורים 54 כיסאות."},{"type":"text","html":"\u003cp>\u003cstrong>פירוק:\u003c/strong> תרגיל אפשר לפרק לשני תרגילים קלים. בפינת הבמה יש 3 שורות של 6 כיסאות. מחלקים כל שורה ל-4 כיסאות ירוקים ו-2 כתומים:\u003c/p>\u003cp>⁦3 × 4 = 12⁩\u003cbr>⁦3 × 2 = 6⁩\u003cbr>⁦12 + 6 = 18⁩\u003c/p>"},{"type":"image","src":"media/chairs-3x6-split.svg","alt":"שלוש שורות של שישה כיסאות; בכל שורה ארבעה כיסאות ירוקים ושניים כתומים","caption":"3 שורות של 6, מפורקות ל-4 ול-2","credit":"איור מקורי"},{"type":"fill","prompt":"ליד הכניסה יש 5 שורות של 7 כיסאות. פרקו את 7 ל-5 ול-2: כמה כיסאות יש? (כתבו מספר)","accept":["35","שלושים וחמש","שלושים וחמישה"],"hint":"5 × 5 ועוד 5 × 2.","explain":"⁦5 × 5 = 25⁩ ו-⁦5 × 2 = 10⁩. ביחד 35 כיסאות."}]},{"title":"משימה 2: הכיבוד","minutes":7,"items":[{"type":"text","html":"\u003cp>עכשיו קונים כיבוד. בקופסת הסוכריות יש 7 שורות של 8 סוכריות. אם ⁦7 × 8⁩ לא קופץ לכם מיד, פרקו כמו באולם: כל שורה ל-5 סוכריות ירוקות ו-3 כתומות.\u003c/p>\u003cp>⁦7 × 5 = 35⁩\u003cbr>⁦7 × 3 = 21⁩\u003cbr>⁦35 + 21 = 56⁩\u003c/p>"},{"type":"image","src":"media/candies-7x8-split.svg","alt":"קופסה עם שבע שורות של שמונה סוכריות; בכל שורה חמש סוכריות ירוקות ושלוש כתומות","caption":"7 שורות של 8 סוכריות, מפורקות ל-5 ול-3","credit":"איור מקורי"},{"type":"fill","prompt":"בקופסה קטנה יותר יש 6 שורות של 7 סוכריות. פרקו את 7 ל-5 ול-2: כמה סוכריות יש? (כתבו מספר)","accept":["42","ארבעים ושתיים","ארבעים ושניים"],"hint":"6 × 5 ועוד 6 × 2.","explain":"⁦6 × 5 = 30⁩ ו-⁦6 × 2 = 12⁩. ביחד 42 סוכריות."},{"type":"text","html":"\u003cp>טריק נוסף: \u003cstrong>הכפלה\u003c/strong>. כפול 4 זה להכפיל פעמיים, וכפול 8 זה להכפיל שלוש פעמים. למשל ⁦4 × 7⁩: קודם 7, אחריו 14, ובסוף 28.\u003c/p>"},{"type":"fill","prompt":"על כל מגש יש 4 פיצות, ויש 7 מגשים. כמה פיצות יש? (כתבו מספר)","accept":["28","עשרים ושמונה"],"hint":"כפול 4: הכפילו את 7 פעמיים.","explain":"7, אחריו 14, ובסוף 28. לכן ⁦4 × 7 = 28⁩."},{"type":"fill","prompt":"בחבילת עוגיות יש 8 עוגיות. קניתם 6 חבילות. כמה עוגיות קניתם? (כתבו מספר)","accept":["48","ארבעים ושמונה"],"hint":"כפול 8: הכפילו את 6 שלוש פעמים: 6, 12, …","explain":"6, אחריו 12, אחריו 24, ובסוף 48. לכן ⁦8 × 6 = 48⁩."},{"type":"mcq","prompt":"צריך 54 בקבוקי שתייה. השתייה נמכרת בארגזים של 6 בקבוקים. כמה ארגזים צריך לקנות?","options":["8","9","6","48"],"answer":1,"feedback":{"0":"8 ארגזים הם ⁦8 × 6 = 48⁩ בקבוקים – לא מספיק.","3":"48 הוא מספר בקבוקים, לא מספר ארגזים."},"hint":"איזה מספר כפול 6 נותן 54?","explain":"⁦9 × 6 = 54⁩: תשעה ארגזים של 6 הם בדיוק 54 בקבוקים."}]},{"title":"משימה 3: פינת המשחקים","minutes":4,"items":[{"type":"text","html":"\u003cp>בפינת המשחקים כל קליעה לסל שווה 9 נקודות. הנה טבלת הניקוד:\u003c/p>\u003cp>קליעה אחת: 9\u003cbr>2 קליעות: 18\u003cbr>3 קליעות: 27\u003cbr>4 קליעות: 36\u003cbr>5 קליעות: 45\u003c/p>\u003cp>הסתכלו טוב על התוצאות. משהו מסתתר שם.\u003c/p>"},{"type":"mcq","prompt":"מה משותף לכל התוצאות בטבלה?","options":["סכום הספרות בכל תוצאה הוא 9","כולן מספרים זוגיים","כולן נגמרות ב-9"],"answer":0,"feedback":{"1":"27 ו-45 הם מספרים אי-זוגיים.","2":"18 נגמר ב-8, ו-27 נגמר ב-7."},"hint":"חברו את הספרות בכל מספר: 1 ועוד 8, 2 ועוד 7…","explain":"1 ועוד 8 הם 9, 2 ועוד 7 הם 9, 3 ועוד 6 הם 9 – וכך בכל התוצאות."},{"type":"tip","html":"\u003cp>\u003cstrong>טריק ה-9:\u003c/strong> בתוצאה של 9 כפול מספר, ספרת העשרות קטנה ב-1 מהמספר, וסכום הספרות הוא 9. למשל ⁦9 × 6⁩: העשרות הן 5, ו-5 ועוד 4 הם 9 – לכן 54.\u003c/p>"},{"type":"fill","prompt":"רוני קלע 7 פעמים. כמה נקודות צבר? נסו את טריק ה-9. (כתבו מספר)","accept":["63","שישים ושלוש","שישים ושלושה"],"hint":"העשרות קטנות ב-1 מ-7, וסכום הספרות 9.","explain":"העשרות הן 6, ו-6 ועוד 3 הם 9. לכן ⁦9 × 7 = 63⁩."}]},{"title":"משימה 4: התקציב","minutes":4,"items":[{"type":"text","html":"\u003cp>משימה אחרונה: לבדוק כמה הכול עולה. קראו כל שאלה בעיון, וחשבו קודם מה מכפילים במה.\u003c/p>"},{"type":"fill","prompt":"חבילה של בלונים עולה 5 שקלים. צריך 9 חבילות. כמה שקלים זה עולה? (כתבו מספר)","accept":["45","ארבעים וחמש","ארבעים וחמישה"],"hint":"9 חבילות, וכל אחת עולה אותו מחיר.","explain":"⁦9 × 5 = 45⁩ שקלים."},{"type":"open","prompt":"המציאו משימה נוספת למסיבה שצריך בה כפל. כתבו את המשימה ואת הפתרון.","hint":"חשבו על משהו שמגיע בקבוצות שוות: צלחות, מדבקות, כרטיסים.","model":"צריך לחלק לכל אחד מ-8 שולחנות 6 צלחות. כמה צלחות צריך? ⁦8 × 6 = 48⁩ צלחות."}]}],"exit":{"prompts":["איפה עוד בחיים שלכם צריך כפל? תנו דוגמה אחת.","איזה תרגיל בלוח הכפל עדיין קשה לכם?"],"selfRating":true},"enrichment":{"title":"אתגר: סידור מושלם","items":[{"type":"mcq","prompt":"רוצים לסדר 24 תלמידים בשורות שוות, בלי מקומות ריקים. איזה סידור לא אפשרי?","options":["3 שורות של 8","4 שורות של 6","5 שורות של 5"],"answer":2,"feedback":{"0":"⁦3 × 8 = 24⁩ – זה סידור אפשרי.","1":"⁦4 × 6 = 24⁩ – זה סידור אפשרי."},"hint":"בדקו כל סידור: כמה תלמידים הוא מושיב?","explain":"⁦5 × 5 = 25⁩, לא 24 – יהיה מקום ריק אחד."},{"type":"open","prompt":"מצאו עוד שני סידורים של 24 תלמידים בשורות שוות, בלי מקומות ריקים. כתבו אותם כתרגילי כפל.","hint":"איזה מספרים כפול משהו נותנים 24?","model":"למשל: 2 שורות של 12 (⁦2 × 12 = 24⁩), ושורה אחת של 24 (⁦1 × 24 = 24⁩). גם 6 שורות של 4 ו-8 שורות של 3 מתאימות."}]},"summaryInstruction":"לחצו על ׳העתקת הסיכום כטקסט׳ ושלחו למורה, או צלמו את המסך ושלחו למורה."}</script>
