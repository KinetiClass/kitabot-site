<script type="application/json" id="unit-data">{"id":"multiplication-table-g5-homework","title":"מבצע מסיבת סוף השנה – לוח הכפל","subject":"מתמטיקה","grade":"ה׳","minutes":25,"created":"2026-10-11","askName":true,"audience":"mixed","intro":{"html":"\u003cp>למה בכלל ללמוד כפל? דמיינו שאתם צוות התכנון של מסיבת סוף השנה של כל השכבה. צריך לדעת כמה כיסאות לסדר, כמה עוגיות לקנות ואם הכסף מספיק. אפשר לספור הכול אחד-אחד… או להשתמש בכפל.\u003c/p>\u003cp>היום אתם הצוות. בכל משימה תגלו טריק שהופך את החישוב לקל.\u003c/p>","goals":["להשתמש בכפל כדי לתכנן ולחשב דברים אמיתיים","להשתמש בטריקים כדי למצוא תוצאה בלוח הכפל","לפתור בעיות מהחיים בעזרת כפל"]},"sections":[{"title":"משימה 1: הושבה באולם","minutes":6,"items":[{"type":"text","html":"\u003cp>באולם מסדרים כיסאות בשורות. הנה פינה קטנה של האולם.\u003c/p>"},{"type":"image","src":"media/array-3x4.svg","alt":"שלוש שורות של כיסאות ירוקים, בכל שורה ארבעה כיסאות","caption":"פינה באולם","credit":"איור מקורי"},{"type":"fill","prompt":"כמה כיסאות יש באיור? (כתבו מספר)","accept":["12","שתים עשרה","שתים-עשרה","שנים עשר"],"hint":"ספרו שורה אחר שורה: 4, 8, …","explain":"3 שורות של 4 כיסאות: 12. בכפל כותבים ⁦3 × 4 = 12⁩."},{"type":"text","html":"\u003cp>עכשיו סידרו את אותה פינה אחרת:\u003c/p>"},{"type":"image","src":"media/array-4x3.svg","alt":"ארבע שורות של כיסאות ירוקים, בכל שורה שלושה כיסאות","caption":"אותה פינה, סידור אחר","credit":"איור מקורי"},{"type":"fill","prompt":"וכמה כיסאות יש עכשיו? (כתבו מספר)","accept":["12","שתים עשרה","שתים-עשרה","שנים עשר"],"hint":"4 שורות של 3: 3, 6, …","explain":"שוב 12: ⁦4 × 3 = 12⁩."},{"type":"text","html":"\u003cp>שמתם לב? ⁦3 × 4⁩ ו-⁦4 × 3⁩ נותנים אותו דבר, כי אלה אותם כיסאות, רק בסידור אחר. \u003cstrong>בכפל הסדר לא משנה.\u003c/strong> לכלל הזה קוראים \u003cstrong>חוק החילוף\u003c/strong>. מי שיודע אחד מהם, יודע גם את השני.\u003c/p>"},{"type":"mcq","prompt":"המורה מציעה לסדר 9 שורות של 6 כיסאות. נועה מציעה 6 שורות של 9 כיסאות. באיזה סידור יש יותר כיסאות?","options":["בסידור של המורה","בשני הסידורים אותו מספר","בסידור של נועה"],"answer":1,"feedback":{"0":"נסו לסובב את הסידור של המורה – מה מקבלים?","2":"נסו לסובב את הסידור של נועה – מה מקבלים?"},"hint":"זכרו: הסדר בכפל לא משנה.","explain":"⁦9 × 6 = 6 × 9 = 54⁩: בשני הסידורים 54 כיסאות."},{"type":"text","html":"\u003cp>ליד הבמה יש 3 שורות של 6 כיסאות: בכל שורה 4 ירוקים ו-2 כתומים.\u003c/p>"},{"type":"image","src":"media/chairs-3x6-split.svg","alt":"שלוש שורות של שישה כיסאות; בכל שורה ארבעה כיסאות ירוקים ושניים כתומים","caption":"ליד הבמה","credit":"איור מקורי"},{"type":"fill","prompt":"כמה כיסאות ירוקים יש? (כתבו מספר)","accept":["12","שתים עשרה","שתים-עשרה","שנים עשר"],"hint":"3 שורות של 4 ירוקים.","explain":"3 שורות של 4: ⁦3 × 4 = 12⁩."},{"type":"fill","prompt":"כמה כיסאות כתומים יש? (כתבו מספר)","accept":["6","שש","שישה"],"hint":"3 שורות של 2 כתומים.","explain":"3 שורות של 2: ⁦3 × 2 = 6⁩."},{"type":"fill","prompt":"כמה כיסאות יש ליד הבמה בסך הכול? (כתבו מספר)","accept":["18","שמונה עשרה","שמונה-עשרה","שמונה עשר"],"hint":"חברו את הירוקים והכתומים.","explain":"12 ועוד 6 הם 18. כלומר ⁦3 × 6 = 18⁩."},{"type":"text","html":"\u003cp>מה עשיתם כאן? מצאתם את ⁦3 × 6⁩ בעזרת שני תרגילים קלים: ⁦3 × 4⁩ ו-⁦3 × 2⁩. זה הטריק השני: \u003cstrong>פירוק\u003c/strong>. כשתרגיל קשה, מפרקים אותו לשני תרגילים קלים ומחברים. במתמטיקה הכלל הזה נקרא \u003cstrong>חוק הפילוג\u003c/strong>.\u003c/p>"},{"type":"fill","prompt":"ליד הכניסה יש 5 שורות של 7 כיסאות. פרקו את 7 ל-5 ול-2: כמה כיסאות יש? (כתבו מספר)","accept":["35","שלושים וחמש","שלושים וחמישה"],"hint":"5 × 5 ועוד 5 × 2.","explain":"⁦5 × 5 = 25⁩ ו-⁦5 × 2 = 10⁩. ביחד 35 כיסאות."}]},{"title":"משימה 2: הכיבוד","minutes":7,"items":[{"type":"text","html":"\u003cp>עכשיו קונים כיבוד. הנה קופסת הסוכריות: 7 שורות, ובכל שורה 5 סוכריות ירוקות ו-3 כתומות.\u003c/p>"},{"type":"image","src":"media/candies-7x8-split.svg","alt":"קופסה עם שבע שורות של שמונה סוכריות; בכל שורה חמש סוכריות ירוקות ושלוש כתומות","caption":"קופסת הסוכריות","credit":"איור מקורי"},{"type":"fill","prompt":"כמה סוכריות ירוקות יש? (כתבו מספר)","accept":["35","שלושים וחמש","שלושים וחמישה"],"hint":"7 שורות של 5.","explain":"⁦7 × 5 = 35⁩."},{"type":"fill","prompt":"כמה סוכריות כתומות יש? (כתבו מספר)","accept":["21","עשרים ואחת","עשרים ואחד"],"hint":"7 שורות של 3.","explain":"⁦7 × 3 = 21⁩."},{"type":"fill","prompt":"כמה סוכריות יש בקופסה? (כתבו מספר)","accept":["56","חמישים ושש","חמישים ושישה"],"hint":"חברו את הירוקות והכתומות.","explain":"35 ועוד 21 הם 56. בעזרת פירוק מצאתם ש-⁦7 × 8 = 56⁩."},{"type":"text","html":"\u003cp>עכשיו פיצות. על כל מגש 4 פיצות. הנה כמה פיצות יש לפי מספר המגשים:\u003c/p>\u003cp>1 מגש: 4 פיצות\u003cbr>2 מגשים: 8 פיצות\u003cbr>4 מגשים: 16 פיצות\u003cbr>8 מגשים: 32 פיצות\u003c/p>"},{"type":"mcq","prompt":"מה קורה למספר הפיצות כשמספר המגשים גדל פי 2?","options":["הוא גדל בעוד 4","הוא גדל פי 2","הוא לא משתנה"],"answer":1,"feedback":{"0":"מ-2 מגשים ל-4 מגשים הפיצות עולות מ-8 ל-16 – זה יותר מעוד 4.","2":"השוו: 8 פיצות ב-2 מגשים, 16 פיצות ב-4 מגשים."},"hint":"השוו בין 2 מגשים ל-4 מגשים, ובין 4 ל-8.","explain":"כשהמגשים גדלים פי 2, גם הפיצות גדלות פי 2: 8, אחריו 16, אחריו 32."},{"type":"text","html":"\u003cp>זה הטריק השלישי: \u003cstrong>הכפלה\u003c/strong>. כפול 4 זה להכפיל פעמיים, וכפול 8 זה להכפיל שלוש פעמים. למשל ⁦8 × 6⁩: קודם 6, אחריו 12, אחריו 24, ובסוף 48.\u003c/p>"},{"type":"fill","prompt":"בחבילת עוגיות יש 4 עוגיות. קניתם 9 חבילות. כמה עוגיות קניתם? הכפילו פעמיים. (כתבו מספר)","accept":["36","שלושים ושש","שלושים ושישה"],"hint":"9, אחריו 18, …","explain":"9, אחריו 18, ובסוף 36. לכן ⁦4 × 9 = 36⁩."},{"type":"mcq","prompt":"צריך 54 בקבוקי שתייה. השתייה נמכרת בארגזים של 6 בקבוקים. כמה ארגזים צריך לקנות?","options":["6","8","48","9"],"answer":3,"feedback":{"1":"8 ארגזים הם ⁦8 × 6 = 48⁩ בקבוקים – לא מספיק.","2":"48 הוא מספר בקבוקים, לא מספר ארגזים."},"hint":"איזה מספר כפול 6 נותן 54?","explain":"⁦9 × 6 = 54⁩: תשעה ארגזים של 6 הם בדיוק 54 בקבוקים."}]},{"title":"משימה 3: פינת המשחקים","minutes":4,"items":[{"type":"text","html":"\u003cp>בפינת המשחקים כל קליעה לסל שווה 9 נקודות. הנה טבלת הניקוד:\u003c/p>\u003cp>קליעה אחת: 9\u003cbr>2 קליעות: 18\u003cbr>3 קליעות: 27\u003cbr>4 קליעות: 36\u003cbr>5 קליעות: 45\u003c/p>\u003cp>הסתכלו טוב על התוצאות. משהו מסתתר שם.\u003c/p>"},{"type":"mcq","prompt":"מה משותף לכל התוצאות בטבלה?","options":["סכום הספרות בכל תוצאה הוא 9","כולן מספרים זוגיים","כולן נגמרות ב-9"],"answer":0,"feedback":{"1":"27 ו-45 הם מספרים אי-זוגיים.","2":"18 נגמר ב-8, ו-27 נגמר ב-7."},"hint":"חברו את הספרות בכל מספר: 1 ועוד 8, 2 ועוד 7…","explain":"1 ועוד 8 הם 9, 2 ועוד 7 הם 9, 3 ועוד 6 הם 9 – וכך בכל התוצאות."},{"type":"tip","html":"\u003cp>\u003cstrong>טריק ה-9:\u003c/strong> בתוצאה של 9 כפול מספר, ספרת העשרות קטנה ב-1 מהמספר, וסכום הספרות הוא 9. למשל ⁦9 × 6⁩: העשרות הן 5, ו-5 ועוד 4 הם 9 – לכן 54.\u003c/p>"},{"type":"fill","prompt":"רוני קלע 7 פעמים. כמה נקודות צבר? נסו את טריק ה-9. (כתבו מספר)","accept":["63","שישים ושלוש","שישים ושלושה"],"hint":"העשרות קטנות ב-1 מ-7, וסכום הספרות 9.","explain":"העשרות הן 6, ו-6 ועוד 3 הם 9. לכן ⁦9 × 7 = 63⁩."}]},{"title":"משימה 4: התקציב","minutes":3,"items":[{"type":"text","html":"\u003cp>משימה אחרונה: לבדוק כמה הכול עולה. קראו כל שאלה בעיון, וחשבו קודם מה מכפילים במה.\u003c/p>"},{"type":"fill","prompt":"חבילה של בלונים עולה 5 שקלים. צריך 9 חבילות. כמה שקלים זה עולה? (כתבו מספר)","accept":["45","ארבעים וחמש","ארבעים וחמישה"],"hint":"9 חבילות, וכל אחת עולה אותו מחיר.","explain":"⁦9 × 5 = 45⁩ שקלים."},{"type":"open","prompt":"המציאו משימה נוספת למסיבה שצריך בה כפל. כתבו את המשימה ואת הפתרון.","hint":"חשבו על משהו שמגיע בקבוצות שוות: צלחות, מדבקות, כרטיסים.","model":"צריך לחלק לכל אחד מ-8 שולחנות 6 צלחות. כמה צלחות צריך? ⁦8 × 6 = 48⁩ צלחות."}]}],"exit":{"prompts":["איפה עוד בחיים שלכם צריך כפל? תנו דוגמה אחת.","איזה תרגיל בלוח הכפל עדיין קשה לכם?"],"selfRating":true},"enrichment":{"title":"אתגר: סידור מושלם","items":[{"type":"mcq","prompt":"רוצים לסדר 24 תלמידים בשורות שוות, בלי מקומות ריקים. איזה סידור לא אפשרי?","options":["3 שורות של 8","4 שורות של 6","5 שורות של 5"],"answer":2,"feedback":{"0":"⁦3 × 8 = 24⁩ – זה סידור אפשרי.","1":"⁦4 × 6 = 24⁩ – זה סידור אפשרי."},"hint":"בדקו כל סידור: כמה תלמידים הוא מושיב?","explain":"⁦5 × 5 = 25⁩, לא 24 – יהיה מקום ריק אחד."},{"type":"open","prompt":"מצאו עוד שני סידורים של 24 תלמידים בשורות שוות, בלי מקומות ריקים. כתבו אותם כתרגילי כפל.","hint":"איזה מספרים כפול משהו נותנים 24?","model":"למשל: 2 שורות של 12 (⁦2 × 12 = 24⁩), ושורה אחת של 24 (⁦1 × 24 = 24⁩). גם 6 שורות של 4 ו-8 שורות של 3 מתאימות."}]},"summaryInstruction":"לחצו על ׳העתקת הסיכום כטקסט׳ ושלחו למורה, או צלמו את המסך ושלחו למורה."}</script>
