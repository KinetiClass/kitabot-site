<script type="application/json" id="unit-data">{"id":"space-solar-system-g3","title":"ביפ יוצא למסע במערכת השמש","subject":"מדע וטכנולוגיה","grade":"ג׳","minutes":20,"created":"2026-10-12","askName":true,"audience":"girls","intro":{"html":"\u003cp>ביפ הוא רובוט קטן שאוהב חלל. היום הוא יוצא למסע, ואת באה איתו! בדרך תגלי מי נמצא במרכז, מי מסתובב סביבו, ואיפה אנחנו גרים.\u003c/p>","goals":["להבין מהי השמש ומהם כוכבי לכת","למצוא את כדור הארץ בין כוכבי הלכת","לסדר את כוכבי הלכת לפי המרחק מהשמש"]},"sections":[{"title":"חלק 1: המשפחה של השמש","minutes":4,"items":[{"type":"image","src":"media/bip.svg","alt":"ביפ, רובוט קטן עם קסדה ואנטנה, צף בחלל","caption":"ביפ, המדריך שלך במסע"},{"type":"text","html":"\u003cp>ביפ הגיע למקום שבו הכול מתחיל. הוא צילם תמונה של המשפחה של השמש. הסתכלי עליה טוב.\u003c/p>"},{"type":"text","html":"\u003cp>\u003cstrong>השמש\u003c/strong> היא \u003cstrong>כוכב\u003c/strong>:\u003c/p>\u003cul>\u003cli>כדור ענק של גז לוהט\u003c/li>\u003cli>זוהרת בעצמה: היא נותנת לנו אור וחום\u003c/li>\u003cli>נמצאת במרכז\u003c/li>\u003c/ul>\u003cp>\u003cstrong>כוכבי הלכת\u003c/strong>:\u003c/p>\u003cul>\u003cli>כדורים שמסתובבים סביב השמש\u003c/li>\u003cli>לא זוהרים בעצמם\u003c/li>\u003cli>אנחנו רואים אותם כי אור השמש פוגע בהם וחוזר אלינו\u003c/li>\u003c/ul>"},{"type":"image","src":"media/solar-system.svg","alt":"השמש בראש התמונה, ומתחתיה בשורה אחת שמונה כוכבי לכת בגדלים שונים: חמה, נוגה, כדור הארץ, מאדים, צדק, שבתאי עם טבעת, אורנוס ונפטון","caption":"המשפחה של השמש. הגדלים והמרחקים בציור לא נכונים, כדי שיהיה אפשר לראות הכול."},{"type":"fill","prompt":"כמה כוכבי לכת יש בתמונה? (כתבי מספר)","accept":["8","שמונה","שמונה כוכבי לכת"],"hint":"ספרי את הכדורים שמתחת לשמש, אחד אחד.","explain":"יש שמונה כוכבי לכת. אנחנו גרים על אחד מהם."},{"type":"mcq","prompt":"מה נמצא במרכז המשפחה של השמש?","options":["כוכב לכת ענק","השמש עצמה","כדור הארץ"],"answer":1,"feedback":{"0":"צדק הוא כוכב לכת גדול, אבל גם הוא מסתובב סביב השמש.","2":"כדור הארץ מסתובב סביב השמש, הוא לא במרכז."},"hint":"מי נותן לנו אור וחום ביום?","explain":"השמש נמצאת במרכז, וכל כוכבי הלכת מסתובבים סביבה."},{"type":"mcq","prompt":"בלילה ביפ רואה את מאדים נוצץ בשמיים, כמו נקודה אדמדמה. אם הוא לא זוהר בעצמו, למה אפשר לראות אותו?","options":["כי הוא מחזיר אור שמגיע מהשמש","כי הוא כוכב כמו השמש","כי יש לו אור משלו שמופעל בלילה"],"answer":0,"feedback":{"1":"מאדים הוא כוכב לכת, לא כוכב. רק השמש זוהרת בעצמה.","2":"כוכבי לכת לא מפיקים אור בעצמם."},"hint":"רק השמש זוהרת בעצמה. מה קורה לאור שלה כשהוא פוגע בכוכב לכת?","explain":"כוכבי הלכת לא זוהרים בעצמם. אור השמש פוגע בהם וחוזר אלינו, וככה אנחנו רואים אותם."},{"type":"text","html":"\u003cp>כוכבי הלכת מסודרים לפי המרחק מהשמש. \u003cstrong>חמה\u003c/strong> הכי קרובה אליה, אחריה \u003cstrong>נוגה\u003c/strong>, ואחריה בא הבית שלנו, \u003cstrong>כדור הארץ\u003c/strong>.\u003c/p>"},{"type":"fill","prompt":"כדור הארץ הוא כוכב הלכת שנמצא במקום ___ מהשמש. (כתבי מספר)","accept":["3","שלוש","שלושה","שלישי","שלישית","השלישי","השלישית","מקום שלישי"],"hint":"חמה היא ראשונה, נוגה שנייה…","explain":"כדור הארץ שלישי מהשמש, אחרי חמה ונוגה."},{"type":"mcq","prompt":"ביפ התחיל מכדור הארץ וטס שני כוכבי לכת הלאה מהשמש. באיזה כוכב לכת הוא נחת?","options":["מאדים","שבתאי","צדק","נוגה"],"answer":2,"feedback":{"0":"מאדים הוא רק כוכב אחד אחרי כדור הארץ. ביפ טס שניים.","3":"נוגה היא לפני כדור הארץ, בכיוון השמש."},"hint":"אחרי כדור הארץ בא מאדים, ואחריו…","explain":"אחרי כדור הארץ בא מאדים, ואז צדק. ביפ נחת על צדק."},{"type":"open","prompt":"ביפ רוצה לנחות על כוכב לכת אחד. לאיזה היית שולחת אותו, ולמה?","hint":"בחרי כוכב מהתמונה: אולי הגדול ביותר, אולי זה עם הטבעת.","model":"לשבתאי, כי יש לו טבעת יפה. או לצדק, כי הוא הכי גדול."}]},{"title":"חלק 2: ענקים וקטנים","minutes":4,"items":[{"type":"text","html":"\u003cp>ביפ צייר את כל כוכבי הלכת באותו קנה מידה. עכשיו אפשר לראות כמה הם שונים בגודלם. כדור הארץ הוא הנקודה הכחולה הקטנה בשורה התחתונה.\u003c/p>"},{"type":"image","src":"media/planet-sizes.svg","alt":"שמונה כוכבי לכת בגדלים יחסיים. למעלה ארבעה ענקים: צדק, שבתאי עם טבעת, אורנוס ונפטון. למטה ארבעה קטנים: חמה, נוגה, כדור הארץ ומאדים","caption":"כוכבי הלכת בגדלים יחסיים"},{"type":"fill","prompt":"כמה כוכבי לכת גדולים בהרבה מכדור הארץ? (כתבי מספר)","accept":["4","ארבעה","ארבע"],"hint":"ספרי את העיגולים הענקיים בשורות העליונות.","explain":"ארבעה: צדק, שבתאי, אורנוס ונפטון."},{"type":"text","html":"\u003cp>אפשר לחלק את כוכבי הלכת לשתי קבוצות:\u003c/p>\u003cul>\u003cli>\u003cstrong>ארבעה קטנים וסלעיים\u003c/strong>: חמה, נוגה, כדור הארץ ומאדים\u003c/li>\u003cli>\u003cstrong>ארבעה ענקים\u003c/strong>: צדק, שבתאי, אורנוס ונפטון\u003c/li>\u003c/ul>\u003cp>צדק הכי גדול. בתוכו אפשר להכניס יותר מאלף כדורי ארץ.\u003c/p>"},{"type":"image","src":"media/solar-system.svg","alt":"השמש בראש התמונה ומתחתיה שמונה כוכבי לכת בשורה, מחמה הקרובה ועד נפטון הרחוק","caption":"השמש וכוכבי הלכת, לפי המרחק"},{"type":"mcq","prompt":"הסתכלי בתמונה של השמש וכוכבי הלכת. ארבעת הענקים נמצאים קרוב לשמש או רחוק ממנה, לעומת ארבעת הקטנים?","options":["רחוק יותר מהשמש","קרוב יותר לשמש","באותו מרחק"],"answer":0,"feedback":{"1":"הכי קרובים לשמש הם דווקא הקטנים: חמה, נוגה, כדור הארץ ומאדים.","2":"הם לא באותו מרחק: הקטנים קרובים לשמש והענקים רחוקים ממנה."},"hint":"מי עומד ראשון בשורה אחרי השמש?","explain":"ארבעת הקטנים הם הראשונים אחרי השמש, והענקים באים אחריהם, רחוק יותר."},{"type":"open","prompt":"ביפ רוצה לצייר על דף את כדור הארץ כנקודה קטנה. איך הוא יצטרך לצייר את צדק לידו? הסבירי.","hint":"בתמונה: כמה גדול צדק לעומת כדור הארץ?","model":"צדק צריך להיות הרבה יותר גדול, כמו כדור ענק לעומת נקודה קטנה, כי בתוכו נכנסים יותר מאלף כדורי ארץ."}]},{"title":"חלק 3: חם וקר","minutes":4,"items":[{"type":"text","html":"\u003cp>ביפ יושב ליד מדורה בלילה. הוא שם לב שבכל מקום מרגישים משהו אחר. הסתכלי על התמונה.\u003c/p>"},{"type":"image","src":"media/campfire.svg","alt":"מדורה, ושלוש דמויות שיושבות במרחקים שונים ממנה: קרוב מאוד, קצת רחוק ורחוק","caption":"ליד המדורה"},{"type":"mcq","prompt":"מי מרגיש הכי הרבה חום?","options":["מי שרחוק מהמדורה","מי שקרוב מאוד אליה","כולם מרגישים אותו דבר"],"answer":1,"feedback":{"0":"ככל שמתרחקים מהמדורה, החום נחלש.","2":"מי שקרוב מרגיש חום חזק יותר."},"hint":"איפה את היית רוצה לשבת ביום קר?","explain":"קרוב למדורה חם יותר, ורחוק ממנה קריר יותר."},{"type":"text","html":"\u003cp>השמש היא כמו מדורה ענקית:\u003c/p>\u003cul>\u003cli>כוכבי לכת \u003cstrong>קרובים\u003c/strong> לשמש מקבלים הרבה חום\u003c/li>\u003cli>כוכבי לכת \u003cstrong>רחוקים\u003c/strong> מקבלים מעט חום, והם קרים מאוד\u003c/li>\u003c/ul>\u003cp>יש הפתעה אחת: \u003cstrong>נוגה\u003c/strong> חמה יותר מחמה, אף שהיא רחוקה יותר מהשמש. סביב נוגה יש שמיים עבים (שכבת גז עבה מאוד), כמו שמיכה שעוטפת אותה. החום של השמש נכנס, ולא מצליח לצאת.\u003c/p>"},{"type":"mcq","prompt":"איזה כוכב לכת הכי חם?","options":["חמה, כי היא הכי קרובה לשמש","מאדים","נוגה","כדור הארץ"],"answer":2,"feedback":{"0":"זו טעות מקובלת! אבל סביב נוגה יש שמיים עבים (שכבת גז) שלוכדים את החום, והיא חמה יותר."},"hint":"לאחד הכוכבים יש שמיים עבים (שכבת גז), כמו שמיכה.","explain":"נוגה הכי חמה. השמיים העבים שלה (שכבת גז) לוכדים את החום."},{"type":"open","prompt":"בכדור הארץ לא חם מדי ולא קר מדי. למה זה חשוב לנו, לדעתך?","hint":"חשבי על מים, על צמחים ועל מה שאנחנו צריכים כדי לחיות.","model":"כי אפשר לחיות כאן: יש מים נוזליים וצמחים, ולא נשרפים מחום ולא קופאים מקור."}]},{"title":"חלק 4: תכנון המסע","minutes":3,"items":[{"type":"text","html":"\u003cp>ביפ הגיע לתחנה הראשונה, ועכשיו הוא צריך להחליט:\u003c/p>\u003cul>\u003cli>הוא רוצה להציב תחנת סוללות שעובדת על אור השמש\u003c/li>\u003cli>היא צריכה הרבה אור, אבל מתקלקלת מחום חזק מאוד\u003c/li>\u003c/ul>\u003cp>ביפ סומך עלייך!\u003c/p>"},{"type":"image","src":"media/solar-system.svg","alt":"השמש וכוכבי הלכת בשורה, מחמה ועד נפטון","caption":"איפה תציבי את התחנה?"},{"type":"mcq","prompt":"איפה כדאי להציב את תחנת הסוללות?","options":["על נפטון","על חמה","על מאדים"],"answer":2,"feedback":{"0":"ביפ הציב את התחנה בנפטון. שם אור השמש חלש מאוד, והסוללה לא התמלאה. ביפ נשאר בלי כוח. נסי שוב.","1":"ביפ הציב את התחנה על חמה. שם האור חזק מאוד, החום עלה והסוללה התקלקלה. נסי שוב."},"hint":"חפשי מקום שלא קרוב מדי לשמש ולא רחוק מדי ממנה.","explain":"במאדים יש מספיק אור לסוללה, ולא חם מדי. ביפ הציב את התחנה, הסוללה התמלאה, והוא יצא להמשך המסע."},{"type":"open","prompt":"ביפ ממשיך לתחנה השנייה. לאיזה כוכב לכת תשלחי אותו, ולמה? יש כמה תשובות נכונות.","hint":"אפשר לחשוב על גודל, על חום או על משהו מיוחד שרצית לראות.","model":"לשבתאי, כי יש לו טבעת מיוחדת. או לכדור הארץ, כי אפשר לשלוח משם ברכה הביתה. כל בחירה עם סיבה מתקבלת."}]}],"exit":{"prompts":["מה למדת על המשפחה של השמש? ספרי במילים שלך.","מה עוד היית רוצה לדעת על החלל?"],"selfRating":true},"enrichment":{"title":"אתגר נוסף","items":[{"type":"text","html":"\u003cp>ביפ אמר: ״כדור הארץ הוא הכי קרוב לשמש, כי הוא הבית שלנו״.\u003c/p>"},{"type":"open","prompt":"האם ביפ צודק? הסבירי לו.","hint":"איזה כוכב לכת הכי קרוב?","model":"ביפ לא צודק. חמה ונוגה קרובות יותר לשמש, וכדור הארץ שלישי."}]},"summaryInstruction":"אפשר לשלוח את כרטיס היציאה בכפתור השליחה, או ללחוץ על ׳העתקת הסיכום כטקסט׳ ולשלוח בהודעה."}</script>
