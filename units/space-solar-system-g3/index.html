<script type="application/json" id="unit-data">{"id":"space-solar-system-g3","title":"ביפ יוצא למסע במערכת השמש","subject":"מדע וטכנולוגיה","grade":"ג׳","minutes":30,"created":"2026-10-12","askName":true,"audience":"girls","intro":{"html":"\u003cp>ביפ הוא רובוט קטן שאוהב חלל. היום הוא יוצא למסע, ואת באה איתו! בדרך תגלי מי נמצא במרכז, מי מסתובב סביבו, ואיפה אנחנו גרים.\u003c/p>","goals":["להבין מהי השמש ומהם כוכבי לכת","למצוא את כדור הארץ בין כוכבי הלכת","לסדר את כוכבי הלכת לפי המרחק מהשמש"]},"sections":[{"title":"חלק 1: המשפחה של השמש","minutes":7,"items":[{"type":"image","src":"media/bip.svg","alt":"ביפ, רובוט קטן עם קסדה ואנטנה, צף בחלל","caption":"ביפ, המדריך שלך במסע"},{"type":"text","html":"\u003cp>ביפ הגיע למקום שבו הכול מתחיל. הוא צילם תמונה של המשפחה של השמש. הסתכלי עליה טוב.\u003c/p>"},{"type":"text","html":"\u003cp>\u003cstrong>השמש\u003c/strong> היא \u003cstrong>כוכב\u003c/strong>:\u003c/p>\u003cul>\u003cli>כדור ענק של גז לוהט\u003c/li>\u003cli>נותן לנו אור וחום\u003c/li>\u003cli>נמצא במרכז\u003c/li>\u003c/ul>\u003cp>\u003cstrong>כוכבי הלכת\u003c/strong>:\u003c/p>\u003cul>\u003cli>כדורים שמסתובבים סביב השמש\u003c/li>\u003cli>לא זוהרים בעצמם, הם רק מחזירים את אור השמש\u003c/li>\u003c/ul>"},{"type":"image","src":"media/solar-system.svg","alt":"השמש בראש התמונה, ומתחתיה בשורה אחת שמונה כוכבי לכת בגדלים שונים: חמה, נוגה, כדור הארץ, מאדים, צדק, שבתאי עם טבעת, אורנוס ונפטון","caption":"המשפחה של השמש. הגדלים והמרחקים בציור לא נכונים, כדי שיהיה אפשר לראות הכול."},{"type":"fill","prompt":"כמה כוכבי לכת יש בתמונה? (כתבי מספר)","accept":["8","שמונה","שמונה כוכבי לכת"],"hint":"ספרי את הכדורים שמתחת לשמש, אחד אחד.","explain":"יש שמונה כוכבי לכת. אנחנו גרים על אחד מהם."},{"type":"mcq","prompt":"מה נמצא במרכז המשפחה של השמש?","options":["כוכב לכת ענק","השמש עצמה","כדור הארץ"],"answer":1,"feedback":{"0":"צדק הוא כוכב לכת גדול, אבל גם הוא מסתובב סביב השמש.","2":"כדור הארץ מסתובב סביב השמש, הוא לא במרכז."},"hint":"מי נותן לנו אור וחום ביום?","explain":"השמש נמצאת במרכז, וכל כוכבי הלכת מסתובבים סביבה."},{"type":"mcq","prompt":"בלילה ביפ רואה את מאדים נוצץ בשמיים. למה אפשר לראות אותו, אם הוא לא זוהר בעצמו?","options":["כי הוא מחזיר אור שמגיע מהשמש","כי הוא כוכב כמו השמש","כי יש לו אור משלו שמופעל בלילה"],"answer":0,"feedback":{"1":"מאדים הוא כוכב לכת, לא כוכב. רק השמש זוהרת בעצמה.","2":"כוכבי לכת לא מפיקים אור בעצמם."},"hint":"חשבי על מראה שמחזירה אור של פנס.","explain":"כוכבי הלכת לא זוהרים בעצמם. אנחנו רואים אותם כי הם מחזירים את אור השמש."},{"type":"text","html":"\u003cp>כוכבי הלכת מסודרים לפי המרחק מהשמש. \u003cstrong>חמה\u003c/strong> הכי קרובה אליה, אחריה \u003cstrong>נוגה\u003c/strong>, ואחריה בא הבית שלנו, \u003cstrong>כדור הארץ\u003c/strong>.\u003c/p>"},{"type":"fill","prompt":"כדור הארץ הוא כוכב הלכת שנמצא במקום ___ מהשמש. (כתבי מספר)","accept":["3","שלוש","שלושה","שלישי","שלישית","השלישי","השלישית","מקום שלישי"],"hint":"חמה היא ראשונה, נוגה שנייה…","explain":"כדור הארץ שלישי מהשמש, אחרי חמה ונוגה."},{"type":"mcq","prompt":"ביפ התחיל מכדור הארץ וטס שני כוכבי לכת הלאה מהשמש. באיזה כוכב לכת הוא נחת?","options":["מאדים","שבתאי","צדק","נוגה"],"answer":2,"feedback":{"0":"מאדים הוא רק כוכב אחד אחרי כדור הארץ. ביפ טס שניים.","3":"נוגה היא לפני כדור הארץ, בכיוון השמש."},"hint":"אחרי כדור הארץ בא מאדים, ואחריו…","explain":"אחרי כדור הארץ בא מאדים, ואז צדק. ביפ נחת על צדק."},{"type":"tf","prompt":"ביפ אומר: ״נפטון קרוב לשמש יותר מנוגה״. נכון או לא נכון?","answer":false,"hint":"בדקי בתמונה מי קרוב יותר לשמש.","explain":"לא נכון. נוגה שנייה מהשמש ונפטון האחרון, הכי רחוק."},{"type":"open","prompt":"ביפ רוצה לנחות על כוכב לכת אחד. לאיזה היית שולחת אותו, ולמה?","hint":"בחרי כוכב מהתמונה: אולי הגדול ביותר, אולי זה עם הטבעת.","model":"לשבתאי, כי יש לו טבעת יפה. או לצדק, כי הוא הכי גדול."}]},{"title":"חלק 2: ענקים וקטנים","minutes":6,"items":[{"type":"text","html":"\u003cp>ביפ צייר את כל כוכבי הלכת באותו קנה מידה. עכשיו אפשר לראות כמה הם שונים בגודלם. כדור הארץ הוא הכחול.\u003c/p>"},{"type":"image","src":"media/planet-sizes.svg","alt":"שמונה כוכבי לכת בגדלים יחסיים. למעלה ארבעה ענקים: צדק, שבתאי עם טבעת, אורנוס ונפטון. למטה ארבעה קטנים: חמה, נוגה, כדור הארץ ומאדים","caption":"כוכבי הלכת בגדלים יחסיים"},{"type":"fill","prompt":"כמה כוכבי לכת גדולים בהרבה מכדור הארץ? (כתבי מספר)","accept":["4","ארבעה","ארבע"],"hint":"ספרי את העיגולים הענקיים בשורות העליונות.","explain":"ארבעה: צדק, שבתאי, אורנוס ונפטון."},{"type":"text","html":"\u003cp>אפשר לחלק את כוכבי הלכת לשתי קבוצות:\u003c/p>\u003cul>\u003cli>\u003cstrong>ארבעה קטנים וסלעיים\u003c/strong>: חמה, נוגה, כדור הארץ ומאדים\u003c/li>\u003cli>\u003cstrong>ארבעה ענקים\u003c/strong>: צדק, שבתאי, אורנוס ונפטון\u003c/li>\u003c/ul>\u003cp>צדק הכי גדול. בתוכו אפשר להכניס יותר מאלף כדורי ארץ.\u003c/p>"},{"type":"mcq","prompt":"הסתכלי איפה כל קבוצה נמצאת ברשימה מהחלק הקודם. מה אפשר להבין?","options":["הענקים נמצאים רחוק יותר מהשמש מהקטנים","הענקים נמצאים הכי קרוב לשמש","אין קשר בין הגודל למרחק"],"answer":0,"feedback":{"1":"הכי קרובים לשמש דווקא הקטנים: חמה, נוגה, כדור הארץ ומאדים.","2":"יש קשר: ארבעת הקטנים קרובים לשמש וארבעת הענקים רחוקים ממנה."},"hint":"באיזו קבוצה נמצאים ארבעת הראשונים אחרי השמש?","explain":"ארבעת הקטנים הם הראשונים אחרי השמש, והענקים באים אחריהם, רחוק יותר."},{"type":"tf","prompt":"ביפ אומר: ״שבתאי גדול יותר מנפטון״. נכון או לא נכון?","answer":true,"hint":"השוו בתמונה את שני העיגולים.","explain":"נכון. שבתאי גדול בהרבה מנפטון, אבל שניהם בין הענקים."},{"type":"open","prompt":"ביפ רוצה לצייר על דף את כדור הארץ כנקודה קטנה. איך הוא יצטרך לצייר את צדק לידו? הסבירי.","hint":"בתמונה: כמה גדול צדק לעומת כדור הארץ?","model":"צדק צריך להיות הרבה יותר גדול, כמו כדור ענק לעומת נקודה קטנה, כי בתוכו נכנסים יותר מאלף כדורי ארץ."}]},{"title":"חלק 3: חם וקר","minutes":6,"items":[{"type":"text","html":"\u003cp>ביפ יושב ליד מדורה בלילה. הוא שם לב שבכל מקום מרגישים משהו אחר. הסתכלי על התמונה.\u003c/p>"},{"type":"image","src":"media/campfire.svg","alt":"מדורה, ושלוש דמויות שיושבות במרחקים שונים ממנה: קרוב מאוד, קצת רחוק ורחוק","caption":"ליד המדורה"},{"type":"mcq","prompt":"מי מרגיש הכי הרבה חום?","options":["מי שרחוק מהמדורה","מי שקרוב מאוד אליה","כולם מרגישים אותו דבר"],"answer":1,"feedback":{"0":"ככל שמתרחקים מהמדורה, החום נחלש.","2":"מי שקרוב מרגיש חום חזק יותר."},"hint":"איפה את היית רוצה לשבת ביום קר?","explain":"קרוב למדורה חם יותר, ורחוק ממנה קריר יותר."},{"type":"text","html":"\u003cp>השמש היא כמו מדורה ענקית:\u003c/p>\u003cul>\u003cli>כוכבי לכת \u003cstrong>קרובים\u003c/strong> לשמש מקבלים הרבה חום\u003c/li>\u003cli>כוכבי לכת \u003cstrong>רחוקים\u003c/strong> מקבלים מעט חום, והם קרים מאוד\u003c/li>\u003c/ul>\u003cp>יש הפתעה אחת: \u003cstrong>נוגה\u003c/strong> חמה יותר מחמה, אף שהיא רחוקה יותר מהשמש. אצלה שמיים עבים שלוכדים את החום, כמו שמיכה.\u003c/p>"},{"type":"mcq","prompt":"נפטון הוא כוכב הלכת הרחוק ביותר מהשמש. מה אפשר להסיק עליו?","options":["הוא חם מאוד","הוא קר מאוד","הוא בדיוק כמו כדור הארץ"],"answer":1,"hint":"חשבי על מי שיושב רחוק מהמדורה.","explain":"נפטון רחוק מאוד מהשמש ולכן מקבל מעט חום והוא קר מאוד."},{"type":"mcq","prompt":"איזה כוכב לכת הכי חם?","options":["חמה, כי היא הכי קרובה לשמש","מאדים","נוגה","כדור הארץ"],"answer":2,"feedback":{"0":"זו טעות מקובלת! אבל לנוגה יש שמיים עבים שלוכדים חום, והיא חמה יותר."},"hint":"אחד הכוכבים אצלו שמיים כמו שמיכה.","explain":"נוגה הכי חמה. השמיים העבים שלה לוכדים את החום."},{"type":"open","prompt":"בכדור הארץ לא חם מדי ולא קר מדי. למה זה חשוב לנו, לדעתך?","hint":"חשבי על מים, על צמחים ועל מה שאנחנו צריכים כדי לחיות.","model":"כי אפשר לחיות כאן: יש מים נוזליים וצמחים, ולא נשרפים מחום ולא קופאים מקור."}]},{"title":"חלק 4: תכנון המסע","minutes":6,"items":[{"type":"text","html":"\u003cp>זמן לתכנן את המסע הגדול של ביפ. הוא יטוס לאורך כל המשפחה של השמש, מהשמש ועד נפטון.\u003c/p>"},{"type":"image","src":"media/solar-system.svg","alt":"השמש וכוכבי הלכת בשורה, מחמה ועד נפטון","caption":"מסלול המסע של ביפ"},{"type":"fill","prompt":"כמה כוכבי לכת נמצאים בין כדור הארץ לנפטון? (כתבי מספר)","accept":["4","ארבעה","ארבע"],"hint":"עברי על הרשימה: אחרי כדור הארץ ועד לפני נפטון.","explain":"מאדים, צדק, שבתאי ואורנוס: ארבעה כוכבי לכת."},{"type":"mcq","prompt":"ביפ לא עמיד בחום חזק מאוד. איזה כוכב לכת הוא צריך לדלג עליו?","options":["צדק","נוגה","שבתאי"],"answer":1,"feedback":{"0":"צדק רחוק מהשמש ולכן אינו חם כל כך.","2":"שבתאי רחוק מאוד מהשמש וקר."},"hint":"זכרי מי הכי חם, בגלל השמיים העבים.","explain":"נוגה היא הכי חמה, ולכן ביפ ידלג עליה."},{"type":"open","prompt":"ביפ יכול לעצור רק בשלוש תחנות. באילו כוכבי לכת תבחרי? יש הרבה תשובות נכונות. הסבירי את הבחירה.","hint":"אפשר לחשוב על גודל, חום, או על משהו שרצית לראות.","model":"אבחר בכדור הארץ כי שם הבית, בצדק כי הוא הכי גדול, ובשבתאי כי יש לו טבעת. כל בחירה עם סיבה מתקבלת."}]}],"exit":{"prompts":["מה למדת על המשפחה של השמש? ספרי במילים שלך.","מה עוד היית רוצה לדעת על החלל?"],"selfRating":true},"enrichment":{"title":"אתגר: ביפ מתבלבל","items":[{"type":"text","html":"\u003cp>ביפ אמר: ״כדור הארץ הוא הכי קרוב לשמש, כי הוא הבית שלנו״.\u003c/p>"},{"type":"open","prompt":"האם ביפ צודק? הסבירי לו.","hint":"איזה כוכב לכת הכי קרוב?","model":"ביפ לא צודק. חמה ונוגה קרובות יותר לשמש, וכדור הארץ שלישי."}]},"summaryInstruction":"אפשר לשלוח את כרטיס היציאה בכפתור השליחה, או ללחוץ על ׳העתקת הסיכום כטקסט׳ ולשלוח בהודעה."}</script>
