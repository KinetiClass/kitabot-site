<script type="application/json" id="unit-data">{"id":"space-solar-system-g3","title":"ביפ יוצא למסע במערכת השמש","subject":"מדע וטכנולוגיה","grade":"ג׳","minutes":25,"created":"2026-10-12","askName":true,"audience":"girls","intro":{"html":"\u003cp>ביפ הוא רובוט קטן שאוהב חלל. היום הוא יוצא למסע במערכת השמש, ואת באה איתו! בדרך תגלי מי נמצא במרכז, מי מסתובב סביבו, ואיפה אנחנו גרים.\u003c/p>","goals":["להסביר מהי השמש ומהם כוכבי לכת","למצוא את כדור הארץ בין כוכבי הלכת","לסדר את כוכבי הלכת לפי המרחק מהשמש","להסביר למה יש יום ולילה"]},"sections":[{"title":"חלק 1: המשפחה של השמש","minutes":4,"items":[{"type":"image","src":"media/bip.svg","alt":"ביפ, רובוט קטן עם קסדה ואנטנה, צף בחלל","caption":"ביפ, המדריך שלך במסע"},{"type":"text","html":"\u003cp>ביפ הגיע למקום שבו הכול מתחיל. הוא צילם תמונה של מערכת השמש. הסתכלי עליה טוב.\u003c/p>"},{"type":"text","html":"\u003cp>\u003cstrong>מערכת השמש\u003c/strong> היא השמש וכל מה שמסתובב סביבה.\u003c/p>\u003cp>\u003cstrong>השמש\u003c/strong> היא \u003cstrong>כוכב\u003c/strong>:\u003c/p>\u003cul>\u003cli>כדור ענק של גז לוהט\u003c/li>\u003cli>זוהרת בעצמה: היא נותנת לנו אור וחום\u003c/li>\u003cli>נמצאת במרכז\u003c/li>\u003cli>גם הכוכבים שרואים בשמיים בלילה הם שמשות, אבל רחוקות מאוד\u003c/li>\u003c/ul>\u003cp>\u003cstrong>כוכבי הלכת\u003c/strong>:\u003c/p>\u003cul>\u003cli>כדורים שמסתובבים סביב השמש\u003c/li>\u003cli>לא זוהרים בעצמם\u003c/li>\u003cli>אנחנו רואים אותם כי אור השמש פוגע בהם וחוזר אלינו\u003c/li>\u003c/ul>"},{"type":"image","src":"media/solar-system.svg","alt":"השמש בראש התמונה, ומתחתיה בשורה אחת שמונה כוכבי לכת בגדלים שונים: חמה, נוגה, כדור הארץ, מאדים, צדק, שבתאי עם טבעת, אורנוס ונפטון","caption":"מערכת השמש. הגדלים והמרחקים בציור לא אמיתיים, כדי שיהיה אפשר לראות הכול."},{"type":"fill","prompt":"כמה כוכבי לכת יש בתמונה? (כתבי מספר)","accept":["8","שמונה","שמונה כוכבי לכת"],"hint":"ספרי את הכדורים שמתחת לשמש, אחד אחד.","explain":"יש שמונה כוכבי לכת. אנחנו גרים על אחד מהם."},{"type":"mcq","prompt":"מה נמצא במרכז מערכת השמש?","options":["כוכב לכת ענק","השמש עצמה","כדור הארץ"],"answer":1,"feedback":{"0":"צדק הוא כוכב לכת גדול, אבל גם הוא מסתובב סביב השמש.","2":"כדור הארץ מסתובב סביב השמש, הוא לא במרכז."},"hint":"מי נותן לנו אור וחום ביום?","explain":"השמש נמצאת במרכז, וכל כוכבי הלכת מסתובבים סביבה."},{"type":"mcq","prompt":"בלילה ביפ רואה את מאדים נוצץ בשמיים, כמו נקודה אדמדמה. אם הוא לא זוהר בעצמו, למה אפשר לראות אותו?","options":["כי הוא מחזיר אור שמגיע מהשמש","כי הוא כוכב כמו השמש","כי יש לו אור משלו שמופעל בלילה"],"answer":0,"feedback":{"1":"מאדים הוא כוכב לכת, לא כוכב. רק השמש זוהרת בעצמה.","2":"כוכבי לכת לא מפיקים אור בעצמם."},"hint":"רק השמש זוהרת בעצמה. מה קורה לאור שלה כשהוא פוגע בכוכב לכת?","explain":"כוכבי הלכת לא זוהרים בעצמם. אור השמש פוגע בהם וחוזר אלינו, וככה אנחנו רואים אותם."},{"type":"text","html":"\u003cp>כוכבי הלכת מסודרים לפי המרחק מהשמש:\u003c/p>\u003cul>\u003cli>\u003cstrong>חמה\u003c/strong> הכי קרובה, אחריה \u003cstrong>נוגה\u003c/strong>\u003c/li>\u003cli>אחריהן הבית שלנו, \u003cstrong>כדור הארץ\u003c/strong>, ואחריו \u003cstrong>מאדים\u003c/strong>\u003c/li>\u003cli>ואז \u003cstrong>צדק\u003c/strong>, \u003cstrong>שבתאי\u003c/strong>, \u003cstrong>אורנוס\u003c/strong> ו\u003cstrong>נפטון\u003c/strong>, הכי רחוק\u003c/li>\u003c/ul>"},{"type":"mcq","prompt":"ביפ יצא מכדור הארץ, התרחק מהשמש, ועצר בכוכב הלכת השני אחרי כדור הארץ. באיזה כוכב לכת הוא נחת?","options":["מאדים","שבתאי","צדק","נוגה"],"answer":2,"feedback":{"0":"מאדים הוא הראשון אחרי כדור הארץ, לא השני.","3":"נוגה נמצאת לפני כדור הארץ, בכיוון השמש."},"hint":"אחרי כדור הארץ בא מאדים, ואחריו… ?","explain":"הראשון אחרי כדור הארץ הוא מאדים, והשני הוא צדק. ביפ נחת על צדק."},{"type":"open","prompt":"ביפ רוצה לנחות על כוכב לכת אחד. לאיזה היית שולחת אותו, ולמה?","hint":"בחרי כוכב מהתמונה: אולי הגדול ביותר, אולי זה עם הטבעת.","model":"לשבתאי, כי יש לו טבעת יפה. או לצדק, כי הוא הכי גדול."}]},{"title":"חלק 2: ענקים וקטנים","minutes":3,"items":[{"type":"text","html":"\u003cp>ביפ צייר את כוכבי הלכת כך שהגדולים נראים גדולים והקטנים נראים קטנים. כדור הארץ הוא הנקודה הכחולה הקטנה בשורה התחתונה.\u003c/p>"},{"type":"image","src":"media/planet-sizes.svg","alt":"שמונה כוכבי לכת בגדלים יחסיים. למעלה ארבעה ענקים: צדק, שבתאי עם טבעת, אורנוס ונפטון. למטה ארבעה קטנים: חמה, נוגה, כדור הארץ ומאדים","caption":"כוכבי הלכת בגדלים יחסיים"},{"type":"fill","prompt":"כמה כוכבי לכת גדולים בהרבה מכדור הארץ? (כתבי מספר)","accept":["4","ארבעה","ארבע"],"hint":"ספרי את העיגולים הענקיים בשורות העליונות.","explain":"ארבעה: צדק, שבתאי, אורנוס ונפטון."},{"type":"text","html":"\u003cp>אפשר לחלק את כוכבי הלכת לשתי קבוצות:\u003c/p>\u003cul>\u003cli>\u003cstrong>ארבעה קטנים וסלעיים\u003c/strong>: חמה, נוגה, כדור הארץ ומאדים. סלעיים: יש להם קרקע קשה, כמו סלעים ואדמה\u003c/li>\u003cli>\u003cstrong>ארבעה ענקים\u003c/strong>: צדק, שבתאי, אורנוס ונפטון\u003c/li>\u003c/ul>\u003cp>צדק הוא הכי גדול. בתוכו אפשר להכניס יותר מאלף כדורי ארץ.\u003c/p>"},{"type":"image","src":"media/solar-system.svg","alt":"השמש בראש התמונה ומתחתיה שמונה כוכבי לכת בשורה, מחמה הקרובה ועד נפטון הרחוק","caption":"השמש וכוכבי הלכת, לפי המרחק"},{"type":"mcq","prompt":"הסתכלי בתמונה. איפה נמצאים ארבעת הענקים, לעומת ארבעת הקטנים?","options":["רחוק יותר מהשמש","קרוב יותר לשמש","באותו מרחק"],"answer":0,"feedback":{"1":"הכי קרובים לשמש הם דווקא הקטנים: חמה, נוגה, כדור הארץ ומאדים.","2":"הם לא באותו מרחק: הקטנים קרובים לשמש והענקים רחוקים ממנה."},"hint":"מי עומד ראשון בשורה אחרי השמש?","explain":"ארבעת הקטנים הם הראשונים אחרי השמש, והענקים באים אחריהם, רחוק יותר."}]},{"title":"חלק 3: חם וקר","minutes":3,"items":[{"type":"text","html":"\u003cp>ביפ יושב ליד מדורה בלילה. הוא שם לב שבכל מקום מרגישים משהו אחר. הסתכלי על התמונה.\u003c/p>"},{"type":"image","src":"media/campfire.svg","alt":"מדורה, ושלוש דמויות שיושבות במרחקים שונים ממנה: קרוב מאוד, קצת רחוק ורחוק","caption":"ליד המדורה"},{"type":"mcq","prompt":"מי מרגיש הכי הרבה חום?","options":["מי שרחוק מהמדורה","מי שקרוב מאוד אליה","כולם מרגישים אותו דבר"],"answer":1,"feedback":{"0":"ככל שמתרחקים מהמדורה, החום נחלש.","2":"מי שקרוב מרגיש חום חזק יותר."},"hint":"איפה את היית רוצה לשבת ביום קר?","explain":"קרוב למדורה חם יותר, ורחוק ממנה קריר יותר."},{"type":"text","html":"\u003cp>השמש היא כמו מדורה ענקית:\u003c/p>\u003cul>\u003cli>כוכבי לכת \u003cstrong>קרובים\u003c/strong> לשמש מקבלים הרבה אור וחום\u003c/li>\u003cli>כוכבי לכת \u003cstrong>רחוקים\u003c/strong> מקבלים מעט אור וחום, והם קרים מאוד\u003c/li>\u003c/ul>\u003cp>יש הפתעה: לא כוכב הלכת הקרוב ביותר לשמש (חמה) הוא הכי חם, אלא \u003cstrong>נוגה\u003c/strong>, שבאה אחריו. סביב נוגה יש שמיים עבים (שכבת גז עבה מאוד), כמו שמיכה שעוטפת אותה. החום של השמש נכנס, ולא מצליח לצאת.\u003c/p>"},{"type":"mcq","prompt":"איזה כוכב לכת הכי חם?","options":["חמה, כי היא הכי קרובה לשמש","מאדים","נוגה","כדור הארץ"],"answer":2,"feedback":{"0":"זו טעות מקובלת! אבל סביב נוגה יש שמיים עבים (שכבת גז) שלוכדים את החום, והיא חמה יותר."},"hint":"לאחד הכוכבים יש שמיים עבים (שכבת גז), כמו שמיכה.","explain":"נוגה הכי חמה. השמיים העבים שלה (שכבת גז) לוכדים את החום."}]},{"title":"חלק 4: למה יש לילה?","minutes":3,"items":[{"type":"text","html":"\u003cp>ביפ מסתכל על כדור הארץ מהחלל. בצד אחד של הכדור יום, ובצד השני לילה. למה זה קורה?\u003c/p>\u003cp>אפשר לנסות בבית, בחדר חשוך: פנס הוא השמש, וכדור או תפוז הם כדור הארץ. אם אין, דמייני את זה.\u003c/p>"},{"type":"image","src":"media/day-night.svg","alt":"השמש משמאל מאירה את כדור הארץ. הצד שפונה אל השמש מואר ומסומן יום, והצד השני חשוך ומסומן לילה","caption":"השמש מאירה רק חצי מכדור הארץ"},{"type":"mcq","prompt":"הדליקי פנס מול הכדור. איזה חלק מהכדור מואר?","options":["כל הכדור","רק הצד שפונה אל הפנס","רק הצד שמרוחק מהפנס"],"answer":1,"feedback":{"0":"פנס לא מאיר את כל הכדור: הצד שמאחור נשאר חשוך.","2":"האור מגיע מהפנס, ולכן הצד שפונה אליו מואר."},"hint":"איפה הצל נמצא כשמאירים על חפץ?","explain":"רק הצד שפונה אל הפנס מואר. כך גם בכדור הארץ: הצד שפונה אל השמש הוא יום."},{"type":"text","html":"\u003cp>כדור הארץ \u003cstrong>מסתובב סביב עצמו\u003c/strong>, כמו סביבון. סיבוב אחד שלם לוקח בערך \u003cstrong>24 שעות\u003c/strong>, וזה יום אחד.\u003c/p>\u003cul>\u003cli>כשהמקום שלנו פונה אל השמש: \u003cstrong>יום\u003c/strong>\u003c/li>\u003cli>כשהוא מסתובב והצד שלנו מתרחק מהשמש: \u003cstrong>לילה\u003c/strong>\u003c/li>\u003cli>כשהמקום שלנו נכנס אל הצד המואר: \u003cstrong>בוקר\u003c/strong>, ונראה שהשמש עולה\u003c/li>\u003c/ul>"},{"type":"image","src":"media/day-night-spin.svg","alt":"כדור הארץ מסתובב לאט, עם יבשות ירוקות. בית קטן על אי ירוק עובר מהצד המואר, שבו יום, אל הצד החשוך, שבו לילה, ואז חלון הבית נדלק, וחוזר חלילה. אלומת אור מהשמש מאירה את הצד המואר. ביפ קטן מופיע בפינה","caption":"הבית מסתובב עם כדור הארץ: מיום ללילה וחזרה. שימי לב מה קורה לחלון של הבית ולכיתוב, ואיפה ביפ מתחבא."},{"type":"mcq","prompt":"בבוקר נראה שהשמש עולה בשמיים. מה באמת קורה?","options":["השמש זזה מעל כדור הארץ","כדור הארץ מסתובב, והמקום שלנו פונה אל השמש","השמש נדלקת בבוקר ונכבית בלילה"],"answer":1,"feedback":{"0":"נראה כאילו השמש זזה, אבל בעצם אנחנו זזים: כדור הארץ מסתובב.","2":"השמש זוהרת כל הזמן. בלילה אנחנו פשוט בצד שלא פונה אליה."},"hint":"חשבי על הכדור והפנס: מי זז, כדי שהמקום יהפוך מואר?","explain":"השמש לא זזה ממקומה. כדור הארץ מסתובב, ולכן המקום שלנו פונה אל השמש בבוקר."}]},{"title":"חלק 5: החלטה וחידות בלש","minutes":4,"items":[{"type":"text","html":"\u003cp>ביפ רוצה להציב תחנת סוללות שעובדת על אור השמש. התחנה צריכה הרבה אור, אבל חום חזק מאוד מקלקל אותה. ביפ סומך עלייך שתבחרי מקום.\u003c/p>"},{"type":"image","src":"media/solar-system.svg","alt":"השמש וכוכבי הלכת בשורה, מחמה ועד נפטון","caption":"איפה תציבי את התחנה?"},{"type":"mcq","prompt":"איפה כדאי להציב את תחנת הסוללות?","options":["על נפטון","על חמה","על מאדים"],"answer":2,"feedback":{"0":"ביפ הציב את התחנה בנפטון. שם אור השמש חלש מאוד, והסוללה לא התמלאה. ביפ נשאר בלי כוח. נסי שוב.","1":"ביפ הציב את התחנה על חמה. שם האור חזק מאוד, החום עלה והסוללה התקלקלה. נסי שוב."},"hint":"חפשי מקום שלא קרוב מדי לשמש, כדי שלא יהיה חם מדי, ולא רחוק מדי ממנה, כדי שיהיה מספיק אור.","explain":"במאדים יש מספיק אור לסוללה, ולא חם מדי. ביפ הציב את התחנה, הסוללה התמלאה, והוא יצא להמשך המסע."},{"type":"text","html":"\u003cp>עכשיו אפשר להיות בלשית! קראי את הרמזים ובחרי.\u003c/p>"},{"type":"mcq","prompt":"חידה בלשית. רמז 1: אני אחד מארבעת הענקים. רמז 2: אני לא הענק הקרוב ביותר לשמש. רמז 3: אני עומד ממש ליד שבתאי ברשימה, מיד לפניו או מיד אחריו. מי אני?","options":["צדק","שבתאי","אורנוס","נפטון"],"answer":2,"feedback":{"0":"צדק הוא הענק הקרוב ביותר לשמש, ורמז 2 אומר שאני לא הוא.","1":"שבתאי לא יכול לעמוד ליד עצמו, ולכן רמז 3 פוסל אותו.","3":"נפטון לא עומד ליד שבתאי: אורנוס נמצא ביניהם."},"hint":"פסלי כוכבים אחד אחרי השני, רמז אחרי רמז. מי נשאר אחרי רמז 2?","explain":"רמז 2 פוסל את צדק. רמז 3 משאיר רק את אורנוס, שעומד מיד אחרי שבתאי."},{"type":"open","prompt":"עכשיו אפשר לכתוב חידה: כתבי שלושה רמזים על כוכב לכת, כך שמי שקורא יוכל לנחש אותו.","hint":"אפשר לכתוב על גודל, על חום או על המקום ברשימה.","model":"אני כוכב לכת. אני הכי גדול. אני רחוק מהשמש יותר ממאדים. (תשובה: צדק). כל חידה עם רמזים נכונים מתאימה."}]}],"exit":{"prompts":["מה למדת על מערכת השמש? ספרי במילים שלך.","מה עוד היית רוצה לדעת על החלל?"],"selfRating":true},"enrichment":{"title":"אתגר נוסף","items":[{"type":"text","html":"\u003cp>קשה למדוד מרחקים ענקיים בחלל, אז מציירים אותם בקטן.\u003c/p>\u003cp>לוקחים משבצות נייר, כמו פתקים בשורה:\u003c/p>\u003cul>\u003cli>משבצת אחת היא המרחק מהשמש עד כדור הארץ\u003c/li>\u003cli>כדור הארץ עומד במשבצת 1\u003c/li>\u003cli>צדק רחוק יותר, והוא עומד במשבצת 5\u003c/li>\u003c/ul>"},{"type":"image","src":"media/squares.svg","alt":"שורה של עשר משבצות מהשמש הלאה. כדור הארץ במשבצת 1, צדק במשבצת 5 ושבתאי במשבצת 10","caption":"שורת משבצות: כל משבצת היא המרחק מהשמש עד כדור הארץ"},{"type":"text","html":"\u003cp>כך נראית כל השורה עד נפטון. בחרנו רק כמה כוכבי לכת כדי שיהיה קל לראות. גם הגדלים בציור לא אמיתיים: מה שחשוב הוא המקום של כל כוכב.\u003c/p>\u003cp>אפשר לעשות את זה גם בבית, עם משבצות מחברת.\u003c/p>"},{"type":"image","src":"media/distance-strip.svg","alt":"קו עם השמש בתחילתו. כדור הארץ במשבצת 1, צדק ב־5, שבתאי ב־10, אורנוס ב־19 ונפטון ב־30","caption":"המקום של כל כוכב לכת בשורת המשבצות"},{"type":"fill","prompt":"כמה משבצות יש בין צדק לשבתאי? (כתבי מספר)","accept":["5","חמש","חמישה"],"hint":"צדק במשבצת 5 ושבתאי במשבצת 10. כמה משבצות עוברים ביניהם?","explain":"10 פחות 5 הם 5 משבצות."},{"type":"fill","prompt":"כמה משבצות יש בין כדור הארץ לנפטון? (כתבי מספר)","accept":["29","עשרים ותשע","עשרים ותשעה"],"hint":"כדור הארץ במשבצת 1 ונפטון במשבצת 30.","explain":"30 פחות 1 הם 29 משבצות."},{"type":"open","prompt":"הסתכלי על המרחקים בין כוכבי הלכת בשורת המשבצות: מ־1 ל־5, מ־5 ל־10, מ־10 ל־19, מ־19 ל־30. מה את מבחינה בגודל הקפיצות?","hint":"האם הקפיצות בין כוכבי הלכת הולכות וגדלות, או קטנות?","model":"ככל שמתרחקים מהשמש, הקפיצות גדלות: 4, 5, 9 ו־11 משבצות. הכוכבים הרחוקים רחוקים מאוד זה מזה."}]},"summaryInstruction":"אפשר לשלוח את כרטיס היציאה בכפתור השליחה, או ללחוץ על ׳העתקת הסיכום כטקסט׳ ולשלוח בהודעה."}</script>
