<script type="application/json" id="unit-data">{"id":"demo-complex-sentence-g8","title":"משפט מורכב: פסוקית עיקרית ופסוקית טפלה – יחידה לדוגמה","subject":"לשון","grade":"ח׳","minutes":45,"created":"2026-10-05","askName":true,"intro":{"html":"\u003cp>נסו לספר לחברה מה קרה לכן אתמול – בלי להשתמש אף פעם במילים \u003cstrong>ש\u003c/strong>, \u003cstrong>כאשר\u003c/strong> או \u003cstrong>כדי ש\u003c/strong>. קשה, נכון? המילים הקטנות האלה עוזרות לנו לבנות משפטים ארוכים ומדויקים. היום נלמד איך בנוי משפט כזה.\u003c/p>","goals":["לזהות משפט מורכב","למצוא את הפסוקית הטפלה בעזרת מילת השעבוד","להפריד בין הפסוקית העיקרית לפסוקית הטפלה","לזהות את התפקיד של הפסוקית הטפלה: פסוקית מושא, פסוקית תיאור או פסוקית לוואי"],"instructions":["עברו על החלקים לפי הסדר. בכל חלק יש הסבר קצר ושאלות.","אם טעיתן – תקבלו רמז ותוכלו לנסות שוב.","בסוף ממלאים כרטיס יציאה ומקבלים מסך סיכום."]},"sections":[{"title":"חלק 1: מהו משפט מורכב?","minutes":7,"items":[{"type":"text","html":"\u003cp>\u003cstrong>משפט מורכב\u003c/strong> הוא משפט שיש בו שני חלקים לפחות: \u003cstrong>פסוקית עיקרית\u003c/strong> ו\u003cstrong>פסוקית טפלה\u003c/strong>.\u003c/p>\u003cp>לכל פסוקית יש \u003cstrong>נשוא\u003c/strong> משלה. לכן במשפט מורכב יש לפחות שני נשואים.\u003c/p>\u003cp>הפסוקית העיקרית היא החלק המרכזי של המשפט. הפסוקית הטפלה &quot;נשענת&quot; עליה וממלאת בה תפקיד – למשל מושא, תיאור או לוואי.\u003c/p>"},{"type":"tf","prompt":"בכל פסוקית יש נשוא משלה.","answer":true,"hint":"חזרו לפסקה השנייה בהסבר.","explain":"נכון. כל פסוקית היא כמו משפט קטן, ויש לה נשוא. לכן משפט עם נשוא אחד בלבד הוא משפט פשוט, ולא מורכב."},{"type":"mcq","prompt":"איזה מהמשפטים הבאים הוא משפט מורכב?","options":["דנה ורוני הלכו לספרייה.","רינה קראה ספר, ודני שיחק בחוץ.","רינה קראה את הספר שהמורה המליצה עליו.","רינה קראה ספר בספרייה אחרי הצהריים."],"answer":2,"feedback":{"0":"יש כאן שני נושאים (דנה ורוני), אבל רק נשוא אחד: הלכו. זה משפט פשוט.","1":"יש כאן שני נשואים, אבל שני החלקים שווים במעמדם ומחוברים ב־ו׳. אין כאן פסוקית טפלה."},"hint":"חפשו משפט שיש בו שני נשואים, ושאחד החלקים בו נפתח במילה כמו ש, כאשר או כדי ש.","explain":"במשפט יש שני נשואים: קראה, המליצה. החלק \"שהמורה המליצה עליו\" הוא פסוקית טפלה שנפתחת ב־ש ומתארת את הספר."}]},{"title":"חלק 2: מילות השעבוד – הכניסה לפסוקית הטפלה","minutes":10,"items":[{"type":"text","html":"\u003cp>הפסוקית הטפלה נפתחת ב\u003cstrong>מילת שעבוד\u003c/strong>. מילות השעבוד הן סוג של מילות קישור: הן מחברות את הפסוקית הטפלה לפסוקית העיקרית.\u003c/p>\u003cp>מילות שעבוד נפוצות: ש, אשר, כאשר (כש), כי, אם, כדי ש, מפני ש, למרות ש, עד ש.\u003c/p>\u003cp>שימו לב: מילת השעבוד היא חלק מהפסוקית הטפלה.\u003c/p>"},{"type":"fill","prompt":"מהי מילת השעבוד במשפט: אם תסיימו מוקדם, תוכלו לעבור למשימת האתגר. (מילה אחת)","accept":["אם","אים"],"hint":"חפשו את המילה שפותחת את החלק שמציב תנאי.","explain":"מילת השעבוד היא \"אם\". היא פותחת את הפסוקית הטפלה \"אם תסיימו מוקדם\"."},{"type":"text","html":"\u003cp>\u003cstrong>שימו לב למילה \"אבל\":\u003c/strong> היא \u003cem>לא\u003c/em> מילת שעבוד. \"אבל\" מחברת שני משפטים שווים במעמדם, שאחד מהם מנוגד לשני – כמו שלמדתן במשפט המאוחה. לדוגמה: רציתי לצאת, אבל ירד גשם.\u003c/p>"},{"type":"tf","prompt":"במשפט \"רציתי לבוא, אבל הייתי חולה\" המילה \"אבל\" פותחת פסוקית טפלה.","answer":false,"hint":"האם המילה \"אבל\" מופיעה ברשימת מילות השעבוד?","explain":"לא נכון. \"אבל\" מחברת שני חלקים שווים במעמדם (ניגוד). זה משפט מאוחה, ואין בו פסוקית טפלה."},{"type":"mcq","prompt":"מהי הפסוקית הטפלה במשפט: כאשר הגענו לתחנה, האוטובוס כבר יצא.","options":["האוטובוס כבר יצא","הגענו לתחנה","כאשר הגענו לתחנה","כאשר הגענו"],"answer":2,"feedback":{"1":"כמעט! זכרו שמילת השעבוד היא חלק מהפסוקית הטפלה.","3":"הפסוקית ממשיכה עד הסוף שלה – גם \"לתחנה\" שייך אליה."},"hint":"מצאו את מילת השעבוד, וסמנו ממנה ועד סוף הפסוקית.","explain":"הפסוקית הטפלה היא \"כאשר הגענו לתחנה\": היא נפתחת במילת השעבוד \"כאשר\" ומסתיימת לפני הפסיק."}]},{"title":"חלק 3: מפרקים משפט מורכב","minutes":11,"items":[{"type":"text","html":"\u003cp>איך מפרקים משפט מורכב? בשלושה צעדים:\u003c/p>\u003col>\u003cli>מוצאים את \u003cstrong>מילת השעבוד\u003c/strong>.\u003c/li>\u003cli>מסמנים ממנה ועד סוף הפסוקית – זו \u003cstrong>הפסוקית הטפלה\u003c/strong>.\u003c/li>\u003cli>מה שנשאר הוא \u003cstrong>הפסוקית העיקרית\u003c/strong>.\u003c/li>\u003c/ol>\u003cp>דוגמה: הספר שקראתי אתמול היה מרתק.\u003c/p>\u003cul>\u003cli>פסוקית טפלה: שקראתי אתמול\u003c/li>\u003cli>פסוקית עיקרית: הספר היה מרתק\u003c/li>\u003c/ul>\u003cp>שימו לב: הפסוקית הטפלה יכולה להופיע באמצע המשפט, ואז הפסוקית העיקרית &quot;נחתכת&quot; לשניים.\u003c/p>"},{"type":"mcq","prompt":"מהי הפסוקית העיקרית במשפט: התלמידות שהשתתפו בתחרות זכו בפרס.","options":["זכו בפרס","התלמידות זכו בפרס","שהשתתפו בתחרות","התלמידות שהשתתפו"],"answer":1,"feedback":{"0":"חסר כאן חלק מהפסוקית העיקרית: מי זכו? הפסוקית הטפלה באמצע, ולכן העיקרית נמצאת משני הצדדים שלה.","2":"זו הפסוקית הטפלה – היא נפתחת במילת השעבוד ש."},"hint":"הוציאו את הפסוקית הטפלה מהמשפט. מה נשאר?","explain":"הפסוקית הטפלה היא \"שהשתתפו בתחרות\". כשמוציאים אותה נשאר: \"התלמידות זכו בפרס\" – זו הפסוקית העיקרית."},{"type":"tip","html":"טריק לבדיקה: בכל פסוקית יש נשוא משלה. אחרי שסימנתן את הפסוקית הטפלה, ודאו שבחלק שנשאר יש נשוא אחר – זו הפסוקית העיקרית."},{"type":"mcq","prompt":"מהי הפסוקית העיקרית במשפט: נשארנו בכיתה עד שהגשם נפסק.","options":["נשארנו בכיתה","עד שהגשם נפסק","הגשם נפסק","נשארנו בכיתה עד"],"answer":0,"feedback":{"1":"זו הפסוקית הטפלה – היא נפתחת במילת השעבוד \"עד ש\"."},"hint":"מילת השעבוד כאן היא \"עד ש\". מה נשאר בלי הפסוקית שהיא פותחת?","explain":"הפסוקית הטפלה היא \"עד שהגשם נפסק\" (מילת השעבוד: עד ש). מה שנשאר – \"נשארנו בכיתה\" – הוא הפסוקית העיקרית."},{"type":"open","prompt":"חברו את שני המשפטים למשפט מורכב אחד: \"ירד גשם חזק.\" \"הטיול בוטל.\" אחר כך כתבו מהי הפסוקית הטפלה במשפט שכתבתן.","hint":"בחרו מילת שעבוד שמתאימה לקשר בין שני המשפטים, למשל מפני ש או כי.","model":"הטיול בוטל מפני שירד גשם חזק. הפסוקית הטפלה: מפני שירד גשם חזק. (אפשר גם: כאשר ירד גשם חזק, הטיול בוטל.)"}]},{"title":"חלק 4: מה התפקיד של הפסוקית הטפלה?","minutes":12,"items":[{"type":"text","html":"\u003cp>הפסוקית הטפלה ממלאת תפקיד בפסוקית העיקרית. כדי לגלות איזה תפקיד, שאלו שאלה מתוך הפסוקית העיקרית:\u003c/p>\u003cul>\u003cli>\u003cstrong>פסוקית מושא\u003c/strong> – עונה על השאלה \u003cem>את מה?\u003c/em> (ולפעמים: על מה? במה?)\u003cbr>המשפט: המורה אמרה שהמבחן נדחה.\u003cbr>המורה אמרה את מה? שהמבחן נדחה.\u003c/li>\u003cli>\u003cstrong>פסוקית תיאור\u003c/strong> – עונה על השאלות \u003cem>מתי? למה? איפה? איך?\u003c/em>\u003cbr>המשפט: כאשר ירד גשם, נשארנו בבית.\u003cbr>מתי נשארנו בבית? כאשר ירד גשם.\u003c/li>\u003cli>\u003cstrong>פסוקית לוואי\u003c/strong> – מוסיפה מידע על שם עצם ועונה על השאלה \u003cem>איזה? איזו?\u003c/em>\u003cbr>המשפט: הספר שקראתי אתמול היה מרתק.\u003cbr>איזה ספר? הספר שקראתי אתמול.\u003c/li>\u003c/ul>"},{"type":"mcq","prompt":"מה התפקיד של הפסוקית הטפלה במשפט: שמעתי שהטיול בוטל.","options":["פסוקית מושא","פסוקית תיאור","פסוקית לוואי"],"answer":0,"hint":"שאלו מתוך הפסוקית העיקרית: שמעתי ___ ?","explain":"שמעתי את מה? שהטיול בוטל. הפסוקית עונה על השאלה \"את מה?\", ולכן היא פסוקית מושא."},{"type":"mcq","prompt":"מה התפקיד של הפסוקית הטפלה במשפט: הכלב שנבח כל הלילה שייך לשכנים.","options":["פסוקית מושא","פסוקית תיאור","פסוקית לוואי"],"answer":2,"feedback":{"0":"הפסוקית לא עונה על \"את מה?\". היא מוסיפה מידע על שם העצם \"הכלב\"."},"hint":"על איזו מילה הפסוקית מוסרת מידע? איזו שאלה מתאימה לה?","explain":"איזה כלב? הכלב שנבח כל הלילה. הפסוקית מוסיפה מידע על שם העצם \"הכלב\", ולכן היא פסוקית לוואי."},{"type":"mcq","prompt":"מה התפקיד של הפסוקית הטפלה במשפט: כשנגמר השיעור, יצאנו להפסקה.","options":["פסוקית מושא","פסוקית תיאור","פסוקית לוואי"],"answer":1,"hint":"שאלו מתוך הפסוקית העיקרית: יצאנו להפסקה – מתי? למה? איזה?","explain":"מתי יצאנו להפסקה? כשנגמר השיעור. הפסוקית עונה על השאלה \"מתי?\", ולכן היא פסוקית תיאור (תיאור זמן)."},{"type":"mcq","prompt":"מה התפקיד של הפסוקית הטפלה במשפט: הבנות גילו שהספרייה סגורה היום.","options":["פסוקית מושא","פסוקית תיאור","פסוקית לוואי"],"answer":0,"feedback":{"2":"הפסוקית לא מתארת את שם העצם \"הבנות\". שאלו: הבנות גילו – את מה?"},"hint":"שאלו מתוך הפסוקית העיקרית: הבנות גילו ___ ?","explain":"הבנות גילו את מה? שהספרייה סגורה היום. לכן זו פסוקית מושא."},{"type":"mcq","prompt":"מה התפקיד של הפסוקית הטפלה במשפט: נשארנו בבית מפני שירד גשם.","options":["פסוקית מושא","פסוקית תיאור","פסוקית לוואי"],"answer":1,"hint":"מילת השעבוד \"מפני ש\" רומזת על השאלה. איזו שאלה?","explain":"למה נשארנו בבית? מפני שירד גשם. הפסוקית עונה על השאלה \"למה?\", ולכן היא פסוקית תיאור (תיאור סיבה)."}]}],"enrichment":{"title":"אתגר: משפט עם כמה פסוקיות","items":[{"type":"mcq","prompt":"כמה פסוקיות טפלות יש במשפט: ידעתי שחברתי תבוא למסיבה שתכננו.","options":["אחת","שתיים","שלוש"],"answer":1,"feedback":{"2":"ספרתן נכון שלושה נשואים, אבל אחת מהפסוקיות היא הפסוקית העיקרית."},"hint":"ספרו את הנשואים במשפט. כמה מהם שייכים לפסוקית העיקרית?","explain":"יש שלושה נשואים: ידעתי, תבוא, תכננו. \"ידעתי\" שייך לפסוקית העיקרית. לכן יש שתי פסוקיות טפלות, ושתיהן נפתחות ב־ש: \"שחברתי תבוא למסיבה\" עונה על השאלה ידעתי את מה? (פסוקית מושא), ובתוכה \"שתכננו\" עונה על השאלה איזו מסיבה? (פסוקית לוואי)."},{"type":"open","prompt":"כתבו משפט מורכב משלכן על בית הספר, שבו הפסוקית הטפלה היא פסוקית לוואי. כתבו מהי הפסוקית הטפלה ולאיזו מילה היא מוסיפה מידע.","hint":"התחילו משם עצם (למשל: המורה, הספרייה, החצר) והוסיפו אחריו פסוקית שנפתחת ב־ש.","model":"הספרייה שנפתחה השנה מלאה בספרים חדשים. הפסוקית הטפלה: שנפתחה השנה. היא מוסיפה מידע על המילה \"הספרייה\" (איזו ספרייה?)."}]},"exit":{"prompts":["הסבירו במילים שלכן: איך מוצאים במשפט מורכב את הפסוקית הטפלה ואת הפסוקית העיקרית?","מה עדיין לא ברור לכן, או מה הייתן רוצות לשאול?"],"selfRating":true},"summaryInstruction":"לחצו על הכפתור \"העתקת הסיכום כטקסט\" למטה, והדביקו בהודעה פרטית למורה בוואטסאפ. אפשר גם לצלם את המסך (אם הוא ארוך – בשני צילומים).","audience":"girls"}</script>
