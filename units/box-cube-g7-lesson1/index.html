 של הנקודה שבה כמה מקצועות נפגשים."},"hint":"פינה היא נקודה, ולא קו או משטח.","explain":"קודקוד הוא נקודה שבה נפגשים שלושה מקצועות (וגם שלוש פאות)."},{"type":"text","html":"\u003cp>לסיכום: שלושת החלקים יחד.\u003c/p>"},{"type":"image","src":"media/box-parts.svg","alt":"תיבה שבה מסומנים שלושת החלקים: פאה צבועה בצהוב, מקצוע צבוע באדום וקודקוד מסומן בנקודה סגולה.","caption":"פאה, מקצוע וקודקוד"},{"type":"link","url":"https://www.youtube.com/watch?v=Qa_US_XragE","label":"סרטון רשות: תיבה – פאות, מקצועות וקודקודים (נפתח בחלון חדש)","source":"לימוד נעים ביוטיוב"}]},{"title":"חלק 2: סופרים את החלקים","minutes":7,"items":[{"type":"text","html":"\u003cp>עכשיו נספור. טיפ: מסתכלים על התיבה לפי קומות, למעלה ולמטה.\u003c/p>"},{"type":"image","src":"media/c-8-vertices.svg","alt":"תיבה שבכל אחת מהפינות שלה יש נקודה סגולה: ארבע למעלה וארבע למטה.","caption":"האיור לשאלה 1 – ספרו את הנקודות הסגולות"},{"type":"fill","prompt":"כמה קודקודים יש לתיבה? (כתבו מספר)","accept":["8","שמונה"],"hint":"ספרו את הנקודות הסגולות: כמה למעלה וכמה למטה?","explain":"4 קודקודים למעלה ו-4 למטה: ביחד 8 קודקודים."},{"type":"image","src":"media/q-visible.svg","alt":"תיבה. הפאה הקדמית, הפאה העליונה והפאה הימנית צבועות כל אחת בצבע אחר. שאר הפאות מוסתרות.","caption":"האיור לשאלה 2 – רואים 3 פאות. כמה מוסתרות?"},{"type":"fill","prompt":"כמה פאות יש לתיבה? (כתבו מספר)","accept":["6","שש","שישה","ששה"],"hint":"באיור רואים 3 פאות. מול כל פאה שרואים יש פאה מוסתרת.","explain":"למעלה ולמטה, מקדימה ומאחור, ימין ושמאל: ביחד 6 פאות."},{"type":"image","src":"media/q-count-edges.svg","alt":"תיבה שהמקצועות שלה מסומנים בשלושה צבעים: המסגרת העליונה בכחול, המקצועות העומדים בירוק והמסגרת התחתונה באדום. ליד כל צבע כתוב: למעלה, עומדים, למטה.","caption":"האיור לשאלה 3 – ספרו כל צבע לחוד"},{"type":"fill","prompt":"כמה מקצועות יש לתיבה? (כתבו מספר)","accept":["12","שתים עשרה","שתים עשר","שנים עשר","שניים עשר"],"hint":"ספרו את המסגרת העליונה, את המסגרת התחתונה ואת המקצועות שעומדים ביניהן.","explain":"4 מקצועות למעלה, 4 למטה ו-4 עומדים: ביחד 12 מקצועות."},{"type":"image","src":"media/q-vertex-edges.svg","alt":"תיבה. בפינה השמאלית התחתונה יש נקודה סגולה, וכל המקצועות שיוצאים ממנה צבועים באדום. אחד מהם מקווקו, כי הוא מוסתר מאחור.","caption":"האיור לשאלה 4 – ספרו את הקווים האדומים"},{"type":"tf","prompt":"בכל קודקוד של תיבה נפגשים שני מקצועות.","answer":false,"hint":"הסתכלו על הנקודה האדומה באיור. כמה קווים יוצאים ממנה?","explain":"לא נכון. בכל קודקוד נפגשים שלושה מקצועות: אחד לאורך, אחד לרוחב ואחד לגובה."}]},{"title":"חלק 3: פאות נגדיות; אורך, רוחב וגובה","minutes":7,"items":[{"type":"text","html":"\u003cp>לכל פאה יש \u003cstrong>פאה נגדית\u003c/strong> שנמצאת מולה. פאות נגדיות הן מלבנים זהים.\u003c/p>"},{"type":"image","src":"media/c-opposite-pairs.svg","alt":"שלוש תיבות זו ליד זו. בכל תיבה צבוע זוג אחד של פאות נגדיות: בראשונה העליונה והתחתונה, בשנייה הקדמית והאחורית, ובשלישית הימנית והשמאלית.","caption":"שלושה זוגות: למעלה ולמטה, מקדימה ומאחור, ימין ושמאל"},{"type":"image","src":"media/q-opposite.svg","alt":"תיבה שהפאה העליונה שלה צבועה, והפאה התחתונה, שמוסתרת, צבועה באותו צבע. כתוב עליהן: למעלה, למטה.","caption":"האיור לשאלה 1"},{"type":"tf","prompt":"שתי פאות נגדיות בתיבה הן תמיד מלבנים זהים.","answer":true,"hint":"חשבו על המכסה ועל התחתית של קופסת נעליים.","explain":"נכון. פאות נגדיות בנויות מאותם שני סוגי מקצועות, ולכן הן מלבנים זהים."},{"type":"tf","prompt":"לתיבה יש 3 זוגות של פאות נגדיות.","answer":true,"hint":"למעלה ולמטה, מקדימה ומאחור…","explain":"נכון. 6 פאות מתחלקות ל-3 זוגות: למעלה ולמטה, מקדימה ומאחור, ימין ושמאל."},{"type":"text","html":"\u003cp>גם המקצועות באים בקבוצות: 4 מקצועות של \u003cstrong>אורך\u003c/strong>, 4 של \u003cstrong>רוחב\u003c/strong> ו-4 של \u003cstrong>גובה\u003c/strong>. בכל קבוצה המקצועות שווים.\u003c/p>"},{"type":"image","src":"media/c-lwh.svg","alt":"תיבה שהמקצועות שלה צבועים בשלושה צבעים: ארבעת מקצועות האורך בכחול, ארבעת מקצועות הרוחב בירוק וארבעת מקצועות הגובה באדום.","caption":"כל צבע: 4 מקצועות שווים"},{"type":"image","src":"media/q-dims-532.svg","alt":"תיבה. המקצוע התחתון מקדימה מסומן 5, המקצוע השמאלי העומד מסומן 3, והמקצוע האלכסוני מימין למטה מסומן 2.","caption":"האיור לשאלה 3 – המידות בס״מ"},{"type":"mcq","prompt":"בתיבה שבאיור, כמה מקצועות אורכם 5 ס״מ?","options":["2","4","1","12"],"answer":1,"feedback":{"0":"ספרתן רק את המקצועות שרואים מקדימה. יש עוד מקצועות כאלה מאחור, גם מוסתרים."},"hint":"כל מידה חוזרת בקבוצה של כמה מקצועות שווים?","explain":"בכל תיבה יש 4 מקצועות לכל מידה: 4 באורך 5 ס״מ, 4 באורך 3 ס״מ ו-4 באורך 2 ס״מ."},{"type":"image","src":"media/q-square-base.svg","alt":"תיבה גבוהה. שני מקצועות הבסיס מסומנים 4, והמקצוע העומד מסומן 7.","caption":"האיור לשאלה 4 – המידות בס״מ"},{"type":"mcq","prompt":"לתיבה יש בסיס שהוא ריבוע עם צלע של 4 ס״מ, והגובה שלה 7 ס״מ. כמה מקצועות אורכם 4 ס״מ?","options":["4","12","8","2"],"answer":2,"feedback":{"0":"ספרתן רק את הבסיס התחתון. גם לבסיס העליון יש 4 צלעות כאלה."},"hint":"הבסיס התחתון והבסיס העליון הם ריבועים זהים.","explain":"בבסיס התחתון 4 מקצועות של 4 ס״מ ובבסיס העליון עוד 4, ביחד 8. ארבעת המקצועות העומדים הם באורך 7 ס״מ."}]},{"title":"חלק 4: מלבן, ריבוע וקובייה","minutes":7,"items":[{"type":"text","html":"\u003cp>\u003cstrong>ריבוע\u003c/strong> הוא מלבן מיוחד: יש לו 4 זוויות ישרות כמו לכל מלבן, וגם כל הצלעות שלו שוות.\u003c/p>"},{"type":"image","src":"media/q-rect-square.svg","alt":"מימין ריבוע ומשמאל מלבן. בפינה של כל אחד מהם יש סימן של זווית ישרה.","caption":"כל ריבוע הוא מלבן"},{"type":"text","html":"\u003cp>\u003cstrong>קובייה\u003c/strong> היא תיבה שכל הפאות שלה ריבועים. לכן כל 12 המקצועות שלה שווים.\u003c/p>"},{"type":"image","src":"media/cube.svg","alt":"ציור של קובייה. שלושה מקצועות מסומנים באות a.","caption":"בקובייה כל המקצועות שווים"},{"type":"image","src":"media/q-box-vs-cube.svg","alt":"שני גופים זה ליד זה: משמאל תיבה ארוכה ונמוכה, ומימין קובייה. מתחת לכל אחד כתוב השם שלו.","caption":"האיור לשאלה 1"},{"type":"tf","prompt":"כל תיבה היא קובייה.","answer":false,"hint":"האם בכל תיבה הפאות הן ריבועים?","explain":"לא נכון. בתיבה כמו קופסת נעליים הפאות הן מלבנים שאינם ריבועים, ולכן היא לא קובייה. ההפך כן נכון: כל קובייה היא תיבה."},{"type":"mcq","prompt":"לאיזה גוף יש 6 פאות, 12 מקצועות ו-8 קודקודים?","options":["רק לתיבה שאינה קובייה","רק לקובייה","לכל תיבה, כולל קובייה"],"answer":2,"feedback":{"1":"גם לקופסת נעליים, שהיא לא קובייה, יש 6 פאות, 12 מקצועות ו-8 קודקודים."},"hint":"קובייה היא סוג של תיבה.","explain":"לכל תיבה יש 6 פאות, 12 מקצועות ו-8 קודקודים. גם קובייה היא תיבה, ולכן זה נכון גם לה."},{"type":"image","src":"media/q-rect-square.svg","alt":"מימין ריבוע ומשמאל מלבן. בפינה של כל אחד מהם יש סימן של זווית ישרה.","caption":"האיור לשאלה 3"},{"type":"open","prompt":"תלמידה אחת אומרת: ״קובייה היא לא תיבה, כי הפאות שלה הן ריבועים ולא מלבנים.״ האם היא צודקת? הסבירו.","hint":"האם ריבוע הוא סוג של מלבן?","model":"שימו לב: התשובה שלכן לא נבדקה. קראו את התשובה לדוגמה ובדקו בעצמכן אם כתבתן משהו דומה. היא לא צודקת. ריבוע הוא מלבן שכל הצלעות שלו שוות. לכן כל הפאות של הקובייה הן מלבנים, והקובייה היא תיבה מיוחדת."}]},{"title":"חלק 5: שלד של תיבה ושל קובייה","minutes":7,"items":[{"type":"text","html":"\u003cp>\u003cstrong>שלד\u003c/strong> של תיבה עשוי רק מהמקצועות. כדי לדעת כמה חוט צריך, מחברים את כל 12 המקצועות:\u003c/p>\u003cp>⁦4·5 + 4·3 + 4·2 = 40⁩ ס״מ.\u003c/p>"},{"type":"image","src":"media/c-wire-532.svg","alt":"שלד של תיבה עשוי מחוט. המקצועות מסומנים 5, 3 ו-2.","caption":"שלד של תיבה, המידות בס״מ"},{"type":"text","html":"\u003cp>בקובייה כל 12 המקצועות שווים, ולכן כופלים: 12 כפול אורך המקצוע.\u003c/p>"},{"type":"image","src":"media/q-cube-wire-6.svg","alt":"שלד של קובייה עשוי מחוט. מקצוע אחד מסומן 6.","caption":"האיור לשאלה 1 – המידה בס״מ"},{"type":"fill","prompt":"כמה ס״מ חוט צריך כדי לבנות שלד של קובייה שאורך המקצוע שלה 6 ס״מ? (כתבו מספר)","accept":["72","72 סמ","72 ס\"מ","72 ס״מ"],"hint":"לקובייה יש 12 מקצועות, וכולם באותו אורך.","explain":"12 מקצועות של 6 ס״מ: 12 כפול 6, כלומר 72 ס״מ."},{"type":"image","src":"media/q-abc.svg","alt":"תיבה. המקצוע התחתון מקדימה מסומן a, המקצוע השמאלי העומד מסומן b, והמקצוע האלכסוני מימין למטה מסומן c.","caption":"האיור לשאלה 2"},{"type":"mcq","prompt":"לתיבה יש מקצועות באורכים a, b ו-c. איזה ביטוי מתאר את האורך של כל המקצועות יחד?","options":["a + b + c","4(a + b + c)","12abc","a · b · c"],"answer":1,"feedback":{"0":"זה האורך של שלושה מקצועות בלבד. לתיבה יש 12 מקצועות."},"hint":"כל אורך מופיע ב-4 מקצועות.","explain":"יש 4 מקצועות מכל אורך, כלומר 4a + 4b + 4c, וזה שווה ל-4(a + b + c)."},{"type":"image","src":"media/q-cube-wire-q.svg","alt":"שלד של קובייה עשוי מחוט. מקצוע אחד מסומן בסימן שאלה.","caption":"האיור לשאלה 3 – כל המקצועות יחד: 60 ס״מ"},{"type":"fill","prompt":"האורך של כל המקצועות של קובייה יחד הוא 60 ס״מ. מה האורך של מקצוע אחד? (כתבו מספר בס״מ)","accept":["5","5 סמ","5 ס\"מ","5 ס״מ","חמש","חמישה"],"hint":"כמה מקצועות שווים יש לקובייה? חלקו את האורך הכולל במספר הזה.","explain":"לקובייה 12 מקצועות שווים. 60 לחלק ל-12 זה 5, ולכן כל מקצוע הוא 5 ס״מ."},{"type":"image","src":"media/q-sticks.svg","alt":"שלד של תיבה עשוי ממקלות. המקצוע התחתון מקדימה מסומן 10, המקצוע העומד מסומן 6, והמקצוע האלכסוני מסומן 3.","caption":"האיור לשאלה 4 – המידות בס״מ"},{"type":"fill","prompt":"בונים שלד של תיבה ממקלות: 4 מקלות של 10 ס״מ, 4 של 6 ס״מ ו-4 של 3 ס״מ. כמה ס״מ מקלות יש בסך הכול? (כתבו מספר)","accept":["76","76 סמ","76 ס\"מ","76 ס״מ"],"hint":"חשבו כל קבוצה בנפרד ואז חברו.","explain":"4 כפול 10 זה 40, 4 כפול 6 זה 24, 4 כפול 3 זה 12. ביחד 76 ס״מ."}]},{"title":"חלק 6: קוראים ציור של תיבה","minutes":6,"items":[{"type":"text","html":"\u003cp>בציור של תיבה, מקצועות שמוסתרים מאחור מציירים בקו \u003cstrong>מקווקו\u003c/strong>.\u003c/p>"},{"type":"image","src":"media/c-hidden.svg","alt":"תיבה. שלושת המקצועות המוסתרים מצוירים בקו מקווקו וצבועים באדום.","caption":"המקצועות המקווקווים מוסתרים מאחור"},{"type":"image","src":"media/q-dashed.svg","alt":"תיבה גבוהה מצוירת בקווים מלאים ובקווים מקווקווים.","caption":"האיור לשאלה 1"},{"type":"fill","prompt":"באיור שלפניכן, כמה מקצועות מצוירים בקו מקווקו? (כתבו מספר)","accept":["3","שלוש","שלושה"],"hint":"כל הקווים המקווקווים יוצאים מאותו קודקוד מוסתר.","explain":"שלושה מקצועות מקווקווים. כולם נפגשים בקודקוד שמוסתר מאחור, למטה."},{"type":"text","html":"\u003cp>אי אפשר לראות פאה ואת הפאה הנגדית לה באותו זמן.\u003c/p>"},{"type":"image","src":"media/q-visible.svg","alt":"תיבה. הפאה הקדמית, הפאה העליונה והפאה הימנית צבועות כל אחת בצבע אחר. שאר הפאות מוסתרות.","caption":"האיור לשאלה 2 – הפאות שרואים צבועות"},{"type":"tf","prompt":"כשמסתכלים על תיבה מכל כיוון, אפשר לראות בבת אחת 4 פאות.","answer":false,"hint":"נסו עם קופסה אמיתית: אם רואים את הפאה הקדמית, האם רואים גם את האחורית?","explain":"לא נכון. מכל זוג של פאות נגדיות רואים לכל היותר פאה אחת. יש 3 זוגות, ולכן רואים לכל היותר 3 פאות."},{"type":"text","html":"\u003cp>סיימתן את השיעור, כל הכבוד! המשיכו לכרטיס היציאה.\u003c/p>\u003cp>\u003cem>כל האיורים ביחידה הם איורים מקוריים.\u003c/em>\u003c/p>"}]}],"exit":{"prompts":["הסבירו במילים שלכן מה ההבדל בין פאה, מקצוע וקודקוד.","מה עדיין לא ברור לי?","איך הרגשת כשלמדת ככה, לבד ביחידה הזו? מה עזר לך ומה הפריע?"],"selfRating":false},"summaryInstruction":"לחצו על ׳העתקת הסיכום כטקסט׳ או צלמו את המסך, ושלחו למורה.","enrichment":{"title":"⭐ אתגר: הקובייה הצבועה","items":[{"type":"text","html":"\u003cp>קובייה גדולה שאורך המקצוע שלה 3 ס״מ צבועה מבחוץ בכל הפאות. חותכים אותה ל-27 קוביות קטנות, שאורך המקצוע של כל אחת 1 ס״מ.\u003c/p>"},{"type":"image","src":"media/q-paint.svg","alt":"קובייה כתומה שבנויה מ-27 קוביות קטנות: 3 שורות, 3 עמודות ו-3 שכבות.","caption":"קובייה של 3 על 3 על 3"},{"type":"image","src":"media/q-paint-3.svg","alt":"קובייה שבנויה מ-27 קוביות קטנות. הקוביות הקטנות שבפינות מסומנות באדום.","caption":"הקוביות הקטנות שבפינות"},{"type":"fill","prompt":"כמה קוביות קטנות צבועות בשלוש פאות?","accept":["8","שמונה"],"hint":"איפה בקובייה הגדולה נפגשות שלוש פאות?","explain":"קובייה קטנה צבועה בשלוש פאות רק אם היא בפינה, כלומר בקודקוד. לקובייה 8 קודקודים, ולכן יש 8 כאלה."},{"type":"image","src":"media/q-paint-2.svg","alt":"קובייה שבנויה מ-27 קוביות קטנות. הקוביות שבאמצע כל מקצוע, לא בפינות, מסומנות באדום.","caption":"הקוביות שבאמצע המקצועות"},{"type":"fill","prompt":"כמה קוביות קטנות צבועות בדיוק בשתי פאות?","accept":["12","שתים עשרה","שנים עשר","שתים עשר","שניים עשר"],"hint":"איפה נפגשות בדיוק שתי פאות?","explain":"על כל מקצוע של הקובייה הגדולה יש קובייה קטנה אחת באמצע (לא בפינות). יש 12 מקצועות, ולכן יש 12 כאלה."},{"type":"image","src":"media/q-paint-1.svg","alt":"קובייה שבנויה מ-27 קוביות קטנות. הקובייה שבמרכז של כל פאה מסומנת באדום.","caption":"הקוביות שבמרכז הפאות"},{"type":"fill","prompt":"כמה קוביות קטנות צבועות בפאה אחת בלבד?","accept":["6","שש","שישה","ששה"],"hint":"חפשו את הקובייה שבאמצע של כל פאה.","explain":"במרכז של כל פאה יש קובייה קטנה אחת שצבועה רק בפאה הזו. יש 6 פאות, ולכן יש 6 כאלה."},{"type":"open","prompt":"כמה קוביות קטנות לא צבועות בכלל? ולמה המספרים שיצאו לכן דומים למספר הקודקודים, המקצועות והפאות?","hint":"חברו את כל מה שמצאתן ובדקו כמה חסר עד 27.","model":"שימו לב: התשובה שלכן לא נבדקה. קראו את התשובה לדוגמה ובדקו בעצמכן אם כתבתן משהו דומה. קובייה אחת לא צבועה: זו שבמרכז, כי 27 פחות 8, 12 ו-6 נותן 1. המספרים דומים כי לכל קודקוד מתאימה קובייה עם שלוש פאות צבועות, לכל מקצוע קובייה עם שתיים ולכל פאה קובייה עם אחת."}]}}</script>
