<script type="application/json" id="unit-data">{"id":"box-cube-g7-lesson1","title":"תיבה וקובייה – שיעור 1: קודקודים, פאות ומקצועות","subject":"מתמטיקה","grade":"ז׳","minutes":45,"created":"2026-10-05","askName":false,"audience":"girls","intro":{"html":"\u003cp>קופסת נעליים, קרטון חלב, קוביית משחק ולבנת לגו: לכולם יש אותה צורה בסיסית. היום נכיר את \u003cstrong>התיבה\u003c/strong> ואת \u003cstrong>הקובייה\u003c/strong>, נלמד איך קוראים לכל חלק שלהן ונגלה כמה חלקים כאלה יש בהן.\u003c/p>","goals":["לזהות ולספור קודקודים, פאות ומקצועות בתיבה ובקובייה","להסביר למה קובייה היא תיבה מיוחדת","לחשב את האורך של כל המקצועות של תיבה ושל קובייה","לקרוא ציור של תיבה עם קווים מקווקווים"]},"sections":[{"title":"חלק 1: מהקופסה לתיבה","minutes":10,"items":[{"type":"text","html":"\u003cp>\u003cstrong>תיבה\u003c/strong> היא גוף שכל הפאות שלו הן מלבנים. לכל תיבה יש שלושה סוגי חלקים:\u003c/p>\u003cul>\u003cli>\u003cstrong>פאה\u003c/strong>: אחד המלבנים שבונים את התיבה (כמו המכסה או הדופן של קופסה).\u003c/li>\u003cli>\u003cstrong>מקצוע\u003c/strong>: הקו שבו שתי פאות נפגשות.\u003c/li>\u003cli>\u003cstrong>קודקוד\u003c/strong>: הנקודה שבה נפגשים שלושה מקצועות (פינה של הקופסה).\u003c/li>\u003c/ul>"},{"type":"image","src":"media/box-parts.svg","alt":"ציור של תיבה. הפאה הקדמית מסומנת במילה פאה, פינה שמאלית למטה מסומנת בנקודה ובמילה קודקוד, והקו הימני מסומן במילה מקצוע. שלושה קווים מקווקווים מראים מקצועות שמוסתרים מאחור.","caption":"החלקים של התיבה","credit":"איור מקורי"},{"type":"image","src":"media/q-corner.svg","alt":"תיבה. שלושה מקצועות מודגשים באדום ונפגשים בנקודה אדומה בפינה הימנית העליונה, ולידה סימן שאלה.","credit":"איור מקורי"},{"type":"mcq","prompt":"הפינה של קופסת נעליים, שבה נפגשים שלושה מקצועות, נקראת:","options":["פאה","מקצוע","קודקוד"],"answer":2,"feedback":{"1":"מקצוע הוא קו שלם, ולא נקודה. חפשו את השם של הנקודה שבה כמה מקצועות נפגשים."},"hint":"פינה היא נקודה, ולא קו או משטח.","explain":"קודקוד הוא נקודה שבה נפגשים שלושה מקצועות (וגם שלוש פאות)."},{"type":"text","html":"\u003cp>איך סופרים בלי להתבלבל? מסתכלים על התיבה לפי קומות:\u003c/p>\u003cul>\u003cli>\u003cstrong>קודקודים:\u003c/strong> 4 למעלה ו-4 למטה, כלומר 8.\u003c/li>\u003cli>\u003cstrong>פאות:\u003c/strong> למעלה ולמטה, מקדימה ומאחור, ימין ושמאל, כלומר 6.\u003c/li>\u003cli>\u003cstrong>מקצועות:\u003c/strong> 4 במסגרת העליונה, 4 במסגרת התחתונה ו-4 עומדים, כלומר 12.\u003c/li>\u003c/ul>"},{"type":"image","src":"media/q-count-edges.svg","alt":"תיבה שהמקצועות שלה מסומנים בשלושה צבעים: המסגרת העליונה בכחול, המקצועות העומדים בירוק והמסגרת התחתונה באדום. ליד כל צבע כתוב: למעלה, עומדים, למטה.","credit":"איור מקורי","caption":"ספרו כל קבוצה לחוד: למעלה, עומדים, למטה"},{"type":"fill","prompt":"כמה מקצועות יש לתיבה? (כתבו מספר)","accept":["12","שתים עשרה","שתים עשר","שנים עשר","שניים עשר"],"hint":"ספרו את המסגרת העליונה, את המסגרת התחתונה ואת המקצועות שעומדים ביניהן.","explain":"4 מקצועות למעלה, 4 למטה ו-4 עומדים: ביחד 12 מקצועות."},{"type":"image","src":"media/q-vertex-edges.svg","alt":"תיבה. בפינה השמאלית התחתונה יש נקודה אדומה, וכל המקצועות שיוצאים ממנה מודגשים באדום. אחד מהם מקווקו, כי הוא מוסתר מאחור.","credit":"איור מקורי","caption":"ספרו את הקווים האדומים שיוצאים מהנקודה"},{"type":"tf","prompt":"בכל קודקוד של תיבה נפגשים שני מקצועות.","answer":false,"hint":"הסתכלו על הנקודה האדומה באיור. כמה קווים יוצאים ממנה?","explain":"לא נכון. בכל קודקוד נפגשים שלושה מקצועות: אחד לאורך, אחד לרוחב ואחד לגובה."},{"type":"link","url":"https://www.youtube.com/watch?v=Qa_US_XragE","label":"סרטון רשות: תיבה – סרטון הסבר (נפתח בחלון חדש)","source":"לימוד נעים ביוטיוב"}]},{"title":"חלק 2: פאות נגדיות, וקובייה היא תיבה מיוחדת","minutes":10,"items":[{"type":"text","html":"\u003cp>לכל פאה בתיבה יש \u003cstrong>פאה נגדית\u003c/strong>, שנמצאת מולה (למעלה ולמטה, מקדימה ומאחור, ימין ושמאל). פאות נגדיות הן מלבנים זהים. לכן לתיבה יש 3 זוגות של פאות נגדיות.\u003c/p>\u003cp>גם המקצועות מתחלקים ל-3 קבוצות של 4 מקצועות שווים: 4 מקצועות של \u003cstrong>אורך\u003c/strong>, 4 של \u003cstrong>רוחב\u003c/strong> ו-4 של \u003cstrong>גובה\u003c/strong>.\u003c/p>"},{"type":"image","src":"media/q-dims-532.svg","alt":"תיבה. המקצוע התחתון מקדימה מסומן 5, המקצוע השמאלי העומד מסומן 3, והמקצוע האלכסוני מימין למטה מסומן 2.","credit":"איור מקורי","caption":"המידות בס״מ: 5, 3 ו-2"},{"type":"mcq","prompt":"בתיבה שבאיור, כמה מקצועות אורכם 5 ס״מ?","options":["2","4","1","12"],"answer":1,"feedback":{"0":"ספרתן רק את המקצועות שרואים מקדימה. יש עוד מקצועות כאלה מאחור, גם מוסתרים."},"hint":"כל מידה חוזרת בקבוצה של כמה מקצועות שווים?","explain":"בכל תיבה יש 4 מקצועות לכל מידה: 4 באורך 5 ס״מ, 4 באורך 3 ס״מ ו-4 באורך 2 ס״מ."},{"type":"image","src":"media/q-opposite.svg","alt":"תיבה שהפאה העליונה שלה צבועה, והפאה התחתונה, שמוסתרת, צבועה באותו צבע. כתוב עליהן: למעלה, למטה.","credit":"איור מקורי","caption":"הפאה העליונה והפאה התחתונה הן פאות נגדיות"},{"type":"tf","prompt":"שתי פאות נגדיות בתיבה הן תמיד מלבנים זהים.","answer":true,"hint":"חשבו על המכסה ועל התחתית של קופסת נעליים.","explain":"נכון. פאות נגדיות בנויות מאותם שני סוגי מקצועות, ולכן הן מלבנים זהים."},{"type":"text","html":"\u003cp>\u003cstrong>קובייה\u003c/strong> היא תיבה שכל הפאות שלה ריבועים. לכן כל 12 המקצועות של הקובייה שווים זה לזה. אם אורך מקצוע הוא a, אז כל המקצועות הם a.\u003c/p>\u003cp>ריבוע הוא מלבן מיוחד, ולכן \u003cstrong>כל קובייה היא תיבה\u003c/strong>, אבל לא כל תיבה היא קובייה.\u003c/p>"},{"type":"image","src":"media/cube.svg","alt":"ציור של קובייה. שלושה מקצועות מסומנים באות a: המקצוע התחתון מקדימה, המקצוע השמאלי העומד והמקצוע האלכסוני מימין למטה.","caption":"קובייה: כל המקצועות שווים","credit":"איור מקורי"},{"type":"image","src":"media/q-box-vs-cube.svg","alt":"שני גופים זה ליד זה: משמאל תיבה ארוכה ונמוכה, ומימין קובייה. מתחת לכל אחד כתוב השם שלו.","credit":"איור מקורי"},{"type":"tf","prompt":"כל תיבה היא קובייה.","answer":false,"hint":"האם בכל תיבה הפאות הן ריבועים?","explain":"לא נכון. בתיבה כמו קופסת נעליים הפאות הן מלבנים שאינם ריבועים, ולכן היא לא קובייה. ההפך כן נכון: כל קובייה היא תיבה."},{"type":"image","src":"media/q-square-base.svg","alt":"תיבה גבוהה. שני מקצועות הבסיס מסומנים 4, והמקצוע העומד מסומן 7.","credit":"איור מקורי","caption":"המידות בס״מ"},{"type":"mcq","prompt":"לתיבה יש בסיס שהוא ריבוע עם צלע של 4 ס״מ, והגובה שלה 7 ס״מ. כמה מקצועות אורכם 4 ס״מ?","options":["4","12","8","2"],"answer":2,"feedback":{"0":"ספרתן רק את הבסיס התחתון. גם לבסיס העליון יש 4 צלעות כאלה."},"hint":"הבסיס התחתון והבסיס העליון הם ריבועים זהים.","explain":"בבסיס התחתון 4 מקצועות של 4 ס״מ ובבסיס העליון עוד 4, ביחד 8. ארבעת המקצועות העומדים הם באורך 7 ס״מ."},{"type":"image","src":"media/q-rect-square.svg","alt":"מימין ריבוע ומשמאל מלבן. בפינה של כל אחד מהם יש סימן של זווית ישרה.","credit":"איור מקורי","caption":"בשתי הצורות יש 4 זוויות ישרות. בריבוע גם כל הצלעות שוות."},{"type":"open","prompt":"תלמידה אחת אומרת: ״קובייה היא לא תיבה, כי הפאות שלה הן ריבועים ולא מלבנים.״ האם היא צודקת? הסבירו.","hint":"האם ריבוע הוא סוג של מלבן?","model":"היא לא צודקת. ריבוע הוא מלבן שכל הצלעות שלו שוות. לכן כל הפאות של הקובייה הן מלבנים, והקובייה היא תיבה מיוחדת."}]},{"title":"חלק 3: שלד של תיבה וקריאת ציור","minutes":12,"items":[{"type":"text","html":"\u003cp>רוצים לבנות \u003cstrong>שלד\u003c/strong> של תיבה מחוט ברזל, רק מהמקצועות, בלי הפאות. כמה חוט צריך? מחברים את האורכים של כל 12 המקצועות.\u003c/p>\u003cp>לתיבה שמידותיה 5, 3 ו-2 ס״מ יש 4 מקצועות של 5 ס״מ, 4 של 3 ס״מ ו-4 של 2 ס״מ:\u003c/p>\u003cp>⁦4·5 + 4·3 + 4·2 = 20 + 12 + 8 = 40⁩ ס״מ.\u003c/p>\u003cp>בקובייה כל 12 המקצועות שווים, ולכן מספיק לכפול: 12 כפול אורך המקצוע.\u003c/p>"},{"type":"image","src":"media/q-cube-wire-6.svg","alt":"שלד של קובייה עשוי מחוט, בלי פאות. מקצוע אחד מסומן 6.","credit":"איור מקורי","caption":"שלד של קובייה: רק המקצועות"},{"type":"fill","prompt":"כמה ס״מ חוט צריך כדי לבנות שלד של קובייה שאורך המקצוע שלה 6 ס״מ? (כתבו מספר)","accept":["72","72 סמ","72 ס\"מ","72 ס״מ"],"hint":"לקובייה יש 12 מקצועות, וכולם באותו אורך.","explain":"12 מקצועות של 6 ס״מ: 12 כפול 6, כלומר 72 ס״מ."},{"type":"image","src":"media/q-abc.svg","alt":"תיבה. המקצוע התחתון מקדימה מסומן a, המקצוע השמאלי העומד מסומן b, והמקצוע האלכסוני מימין למטה מסומן c.","credit":"איור מקורי"},{"type":"mcq","prompt":"לתיבה יש מקצועות באורכים a, b ו-c. איזה ביטוי מתאר את האורך של כל המקצועות יחד?","options":["a + b + c","4(a + b + c)","12abc","a · b · c"],"answer":1,"feedback":{"0":"זה האורך של שלושה מקצועות בלבד. לתיבה יש 12 מקצועות."},"hint":"כל אורך מופיע ב-4 מקצועות.","explain":"יש 4 מקצועות מכל אורך, כלומר 4a + 4b + 4c, וזה שווה ל-4(a + b + c)."},{"type":"image","src":"media/q-cube-wire-q.svg","alt":"שלד של קובייה עשוי מחוט. מקצוע אחד מסומן בסימן שאלה.","credit":"איור מקורי","caption":"כל המקצועות יחד: 60 ס״מ"},{"type":"fill","prompt":"האורך של כל המקצועות של קובייה יחד הוא 60 ס״מ. מה האורך של מקצוע אחד? (כתבו מספר בס״מ)","accept":["5","5 סמ","5 ס\"מ","5 ס״מ","חמש","חמישה"],"hint":"כמה מקצועות שווים יש לקובייה? חלקו את האורך הכולל במספר הזה.","explain":"לקובייה 12 מקצועות שווים. 60 לחלק ל-12 זה 5, ולכן כל מקצוע הוא 5 ס״מ."},{"type":"text","html":"\u003cp>ככה \u003cstrong>קוראים ציור של תיבה\u003c/strong>: הנייר שטוח, ולכן מציירים את התיבה כאילו מסתכלים עליה באלכסון. מקצועות שרואים מציירים בקו מלא. מקצועות שמוסתרים מאחור מציירים בקו \u003cstrong>מקווקו\u003c/strong>.\u003c/p>\u003cp>כשמסתכלים על תיבה, רואים לכל היותר 3 פאות בבת אחת. בציור הרגיל רואים 9 מקצועות בקו מלא ו-3 מקצועות מקווקווים.\u003c/p>"},{"type":"image","src":"media/q-dashed.svg","alt":"תיבה גבוהה מצוירת בקווים מלאים ובקווים מקווקווים.","credit":"איור מקורי"},{"type":"fill","prompt":"באיור שלפניכן, כמה מקצועות מצוירים בקו מקווקו? (כתבו מספר)","accept":["3","שלוש","שלושה"],"hint":"כל הקווים המקווקווים יוצאים מאותו קודקוד מוסתר.","explain":"שלושה מקצועות מקווקווים. כולם נפגשים בקודקוד שמוסתר מאחור, למטה."},{"type":"image","src":"media/q-visible.svg","alt":"תיבה. הפאה הקדמית, הפאה העליונה והפאה הימנית צבועות כל אחת בצבע אחר. שאר הפאות מוסתרות.","credit":"איור מקורי","caption":"הפאות שרואים צבועות"},{"type":"tf","prompt":"כשמסתכלים על תיבה מכל כיוון, אפשר לראות בבת אחת 4 פאות.","answer":false,"hint":"נסו עם קופסה אמיתית: אם רואים את הפאה הקדמית, האם רואים גם את האחורית?","explain":"לא נכון. מכל זוג של פאות נגדיות רואים לכל היותר פאה אחת. יש 3 זוגות, ולכן רואים לכל היותר 3 פאות."}]},{"title":"חלק 4: חזרה קצרה, ואז פעילות ההערכה","minutes":8,"items":[{"type":"text","html":"\u003cp>לפני פעילות ההערכה, עוד שלוש שאלות קצרות על כל מה שלמדנו.\u003c/p>"},{"type":"image","src":"media/q-box-vs-cube.svg","alt":"שני גופים זה ליד זה: משמאל תיבה ארוכה ונמוכה, ומימין קובייה. מתחת לכל אחד כתוב השם שלו.","credit":"איור מקורי"},{"type":"mcq","prompt":"לאיזה גוף יש 6 פאות, 12 מקצועות ו-8 קודקודים?","options":["רק לתיבה שאינה קובייה","רק לקובייה","לכל תיבה, כולל קובייה"],"answer":2,"feedback":{"1":"גם לקופסת נעליים, שהיא לא קובייה, יש 6 פאות, 12 מקצועות ו-8 קודקודים."},"hint":"קובייה היא סוג של תיבה.","explain":"לכל תיבה יש 6 פאות, 12 מקצועות ו-8 קודקודים. גם קובייה היא תיבה, ולכן זה נכון גם לה."},{"type":"image","src":"media/q-sticks.svg","alt":"שלד של תיבה עשוי ממקלות. המקצוע התחתון מקדימה מסומן 10, המקצוע העומד מסומן 6, והמקצוע האלכסוני מסומן 3.","credit":"איור מקורי","caption":"המידות בס״מ"},{"type":"fill","prompt":"בונים שלד של תיבה ממקלות: 4 מקלות של 10 ס״מ, 4 של 6 ס״מ ו-4 של 3 ס״מ. כמה ס״מ מקלות יש בסך הכול? (כתבו מספר)","accept":["76","76 סמ","76 ס\"מ","76 ס״מ"],"hint":"חשבו כל קבוצה בנפרד ואז חברו.","explain":"4 כפול 10 זה 40, 4 כפול 6 זה 24, 4 כפול 3 זה 12. ביחד 76 ס״מ."},{"type":"image","src":"media/q-opposite.svg","alt":"תיבה שהפאה העליונה שלה צבועה, והפאה התחתונה, שמוסתרת, צבועה באותו צבע. כתוב עליהן: למעלה, למטה.","credit":"איור מקורי","caption":"זוג אחד: למעלה ולמטה. אילו עוד זוגות יש?"},{"type":"tf","prompt":"לתיבה יש 3 זוגות של פאות נגדיות.","answer":true,"hint":"למעלה ולמטה, מקדימה ומאחור…","explain":"נכון. 6 פאות מתחלקות ל-3 זוגות: למעלה ולמטה, מקדימה ומאחור, ימין ושמאל."},{"type":"text","html":"\u003cp>\u003cstrong>זה סוף השיעור, כל הכבוד!\u003c/strong>\u003c/p>\u003cp>עכשיו פתחו את הקישור ועברו לפעילות ההערכה. אין צורך להמשיך ביחידה הזו.\u003c/p>"},{"type":"link","url":"https://moodlemoe.lms.education.gov.il/mod/quiz/view.php?id=361750","label":"פעילות הערכה: תיבה וקובייה","source":"אתר הלמידה של משרד החינוך"}]}],"exit":{"prompts":["אין צורך לכתוב כאן. חזרו לחלק 4 ופתחו את הקישור לפעילות ההערכה."],"selfRating":false},"summaryInstruction":"פתחו את פעילות ההערכה – הקישור נמצא בסוף חלק 4.","enrichment":{"title":"⭐ אתגר: הקובייה הצבועה","items":[{"type":"text","html":"\u003cp>קובייה גדולה שאורך המקצוע שלה 3 ס״מ צבועה מבחוץ בכל הפאות. חותכים אותה ל-27 קוביות קטנות, שאורך המקצוע של כל אחת 1 ס״מ.\u003c/p>"},{"type":"image","src":"media/q-paint.svg","alt":"קובייה כתומה שבנויה מ-27 קוביות קטנות: 3 שורות, 3 עמודות ו-3 שכבות.","credit":"איור מקורי","caption":"קובייה של 3 על 3 על 3"},{"type":"image","src":"media/q-paint-3.svg","alt":"קובייה שבנויה מ-27 קוביות קטנות. הקוביות הקטנות שבפינות מסומנות באדום.","credit":"איור מקורי","caption":"הקוביות הקטנות שבפינות"},{"type":"fill","prompt":"כמה קוביות קטנות צבועות בשלוש פאות?","accept":["8","שמונה"],"hint":"איפה בקובייה הגדולה נפגשות שלוש פאות?","explain":"קובייה קטנה צבועה בשלוש פאות רק אם היא בפינה, כלומר בקודקוד. לקובייה 8 קודקודים, ולכן יש 8 כאלה."},{"type":"image","src":"media/q-paint-2.svg","alt":"קובייה שבנויה מ-27 קוביות קטנות. הקוביות שבאמצע כל מקצוע, לא בפינות, מסומנות באדום.","credit":"איור מקורי","caption":"הקוביות שבאמצע המקצועות"},{"type":"fill","prompt":"כמה קוביות קטנות צבועות בדיוק בשתי פאות?","accept":["12","שתים עשרה","שנים עשר","שתים עשר","שניים עשר"],"hint":"איפה נפגשות בדיוק שתי פאות?","explain":"על כל מקצוע של הקובייה הגדולה יש קובייה קטנה אחת באמצע (לא בפינות). יש 12 מקצועות, ולכן יש 12 כאלה."},{"type":"image","src":"media/q-paint-1.svg","alt":"קובייה שבנויה מ-27 קוביות קטנות. הקובייה שבמרכז של כל פאה מסומנת באדום.","credit":"איור מקורי","caption":"הקוביות שבמרכז הפאות"},{"type":"fill","prompt":"כמה קוביות קטנות צבועות בפאה אחת בלבד?","accept":["6","שש","שישה","ששה"],"hint":"חפשו את הקובייה שבאמצע של כל פאה.","explain":"במרכז של כל פאה יש קובייה קטנה אחת שצבועה רק בפאה הזו. יש 6 פאות, ולכן יש 6 כאלה."},{"type":"open","prompt":"כמה קוביות קטנות לא צבועות בכלל? ולמה המספרים שיצאו לכן דומים למספר הקודקודים, המקצועות והפאות?","hint":"חברו את כל מה שמצאתן ובדקו כמה חסר עד 27.","model":"קובייה אחת לא צבועה: זו שבמרכז, כי 27 פחות 8, 12 ו-6 נותן 1. המספרים דומים כי לכל קודקוד מתאימה קובייה עם שלוש פאות צבועות, לכל מקצוע קובייה עם שתיים ולכל פאה קובייה עם אחת."}]}}</script>
