<script type="application/json" id="unit-data">{"id":"demo-nile-ancient-egypt-g6","title":"מצרים העתיקה – הנילוס והחיים לצדו – יחידה לדוגמה","subject":"היסטוריה","grade":"ו׳","minutes":45,"created":"2026-10-05","askName":true,"intro":{"html":"\u003cp>דמיינו ארץ שכמעט אף פעם לא יורד בה גשם, ורובה מדבר צהוב ולוהט. ובכל זאת, דווקא שם קמה אחת הממלכות החזקות והעשירות בעולם העתיק. איך זה ייתכן? התשובה זורמת באמצע הארץ: נהר הנילוס.\u003c/p>","goals":["להסביר למה כמעט כל המצרים הקדמונים חיו לאורך הנילוס","לתאר מה קרה בהצפה השנתית ואיך היא קבעה את לוח השנה של החקלאים","להסביר במילים שלכם למה אומרים שמצרים היא ״מתנת הנילוס״"]},"sections":[{"title":"חלק 1: ארץ של מדבר ונהר","minutes":8,"items":[{"type":"text","html":"\u003cp>רוב שטחה של מצרים הוא \u003cstrong>מדבר\u003c/strong>, וגשם כמעט לא יורד שם.\u003c/p>\u003cp>באמצע המדבר זורם \u003cstrong>הנילוס\u003c/strong> \u003cstrong>מהדרום לצפון\u003c/strong>, עד הים התיכון. ליד הים הוא מתפצל ויוצר שטח ירוק ורחב: \u003cstrong>הדלתא\u003c/strong>.\u003c/p>\u003cp>כמעט כל המצרים גרו ברצועה הירוקה והצרה לאורך הנהר – שם היו מים לשתייה ולשדות.\u003c/p>"},{"type":"tf","prompt":"רוב המצרים הקדמונים גרו במדבר, רחוק מהנהר, כי שם היה בטוח יותר.","answer":false,"hint":"חשבו: מה צריך כדי לגדל אוכל בארץ שכמעט אין בה גשם?","explain":"כמעט כולם גרו ברצועה הצרה לאורך הנילוס, כי רק שם היו מים לשתייה ולחקלאות."},{"type":"text","html":"\u003cp>שימו לב: \u003cstrong>מצרים העליונה\u003c/strong> היא ה\u003cstrong>דרום\u003c/strong>, משם הנהר מגיע. \u003cstrong>מצרים התחתונה\u003c/strong> היא ה\u003cstrong>צפון\u003c/strong>, ליד הים.\u003c/p>"},{"type":"mcq","prompt":"איפה נמצאת מצרים העליונה?","options":["בצפון, ליד הים התיכון","בדרום, במעלה הנהר","במדבר שממערב לנהר"],"answer":1,"feedback":{"0":"זו טעות נפוצה! במפה שלנו הצפון למעלה, אבל המצרים קראו ״עליונה״ לחלק שממנו הנהר מגיע – הדרום."},"hint":"הנהר זורם מהדרום לצפון. מאיפה הוא ״יורד״?","explain":"מצרים העליונה היא בדרום, כי משם הנילוס מגיע. הוא זורם צפונה אל מצרים התחתונה והדלתא."}]},{"title":"חלק 2: ההצפה – הפלא שחזר כל שנה","minutes":12,"items":[{"type":"text","html":"\u003cp>כל קיץ יורדים גשמים כבדים בהרים הרחוקים בדרום (היום: \u003cstrong>אתיופיה\u003c/strong>). המים זורמים לנילוס, והוא עולה על גדותיו ומציף את השדות. זו \u003cstrong>ההצפה\u003c/strong>.\u003c/p>\u003cp>כשהמים יורדים, נשארת על השדות שכבה של \u003cstrong>סחף\u003c/strong> – בוץ שחור ועשיר, כמו דשן טבעי.\u003c/p>"},{"type":"mcq","prompt":"מאיפה הגיעו המים של ההצפה השנתית?","options":["מגשמים כבדים בהרים רחוקים בדרום","מגשמים כבדים שירדו במצרים עצמה","מגלים של הים התיכון שנכנסו לנהר"],"answer":0,"feedback":{"1":"במצרים כמעט לא יורד גשם. המים הגיעו ממקום רחוק."},"hint":"חזרו לפסקה: איפה ירדו הגשמים הכבדים?","explain":"הגשמים ירדו בהרים שבדרום (באתיופיה של היום), והמים זרמו בנילוס צפונה עד מצרים."},{"type":"text","html":"\u003cp>המצרים קראו לארצם \u003cstrong>״כֶּמֶת״\u003c/strong> – ״הארץ השחורה״, על שם הבוץ השחור.\u003c/p>\u003cp>בלוח השנה שלהם היו שלוש עונות:\u003c/p>\u003col>\u003cli>\u003cstrong>הצפה\u003c/strong> – השדות מתחת למים.\u003c/li>\u003cli>\u003cstrong>זריעה וצמיחה\u003c/strong> – המים יורדים, וזורעים.\u003c/li>\u003cli>\u003cstrong>קציר\u003c/strong> – הנהר נמוך, ואוספים את היבול.\u003c/li>\u003c/ol>"},{"type":"fill","prompt":"איך נקראת שכבת הבוץ השחור שהשאיר הנהר על השדות? (מילה אחת)","accept":["סחף","הסחף","סחוף","טין","הטין"],"hint":"המילה מודגשת בהסבר הראשון של החלק הזה.","explain":"הסחף הוא בוץ עשיר שהמים הביאו איתם. הוא הפך את האדמה לפורייה מאוד."},{"type":"mcq","prompt":"מתי זרעו החקלאים המצרים את השדות?","options":["בזמן שהשדות היו מוצפים","בעונת הקציר, כשהנהר הכי נמוך","מיד אחרי שהמים ירדו"],"answer":2,"hint":"זרעים צריכים אדמה רטובה – אבל לא מכוסה במים.","explain":"אחרי שהמים ירדו נשארה אדמה רטובה ומכוסה בסחף – הזמן הכי טוב לזרוע."}]},{"title":"חלק 3: לחיות לצד הנהר","minutes":12,"items":[{"type":"text","html":"\u003cp>המצרים חפרו \u003cstrong>תעלות\u003c/strong> שהובילו מים לשדות רחוקים. כדי להרים מים מהנהר השתמשו ב\u003cstrong>שדוף\u003c/strong>: מוט ארוך עם דלי בצד אחד ומשקולת בצד השני.\u003c/p>\u003cp>בשדות גידלו בעיקר \u003cstrong>חיטה ושעורה\u003c/strong> ללחם, ו\u003cstrong>פשתן\u003c/strong> לבגדים.\u003c/p>"},{"type":"mcq","prompt":"למה שימש השדוף?","options":["לטחון חיטה לקמח","למדוד כמה זמן עבר מההצפה","להרים מים מהנהר או מהתעלה אל השדה"],"answer":2,"hint":"יש בו דלי – מה ממלאים בדלי ליד הנהר?","explain":"השדוף הוא מנוף עם דלי ומשקולת. בעזרתו הרימו מים מהנהר והתעלות כדי להשקות את השדות."},{"type":"text","html":"\u003cp>הצפה נמוכה מדי – רעב. הצפה גבוהה מדי – בתים נהרסים. את גובה המים מדדו ב\u003cstrong>נילומטר\u003c/strong>: מדרגות או עמוד עם סימנים. לפי המדידה גם קבעו כמה מס ישלמו.\u003c/p>\u003cp>הנילוס היה גם \u003cstrong>הכביש הראשי\u003c/strong>: בסירות הובילו אנשים, תבואה ואבנים. מצמח ה\u003cstrong>פפירוס\u003c/strong> שעל הגדות עשו נייר.\u003c/p>"},{"type":"tf","prompt":"ככל שההצפה גבוהה יותר – תמיד טוב יותר לחקלאים.","answer":false,"hint":"מה קורה לבתים שליד הנהר כשהמים עולים יותר מדי?","explain":"הצפה גבוהה מדי הרסה בתים וכפרים, והצפה נמוכה מדי גרמה לרעב. המצרים קיוו להצפה ״בדיוק במידה״."},{"type":"open","prompt":"היסטוריון יווני בשם הרודוטוס כתב: ״מצרים היא מתנת הנילוס״. הסבירו במילים שלכם למה. השתמשו לפחות בשתי דוגמאות ממה שלמדתם.","hint":"חשבו על מים, על הבוץ השחור, על החקלאות ועל הסירות. מה היה קורה בלי הנהר?","model":"בלי הנילוס מצרים הייתה רק מדבר. הנהר נתן מים לשתייה ולהשקיה, וההצפה השאירה סחף שחור שהפך את האדמה לפורייה, ולכן היה מספיק אוכל. בנוסף, הנהר שימש דרך להעביר בסירות אנשים, תבואה ואבנים."}]}],"enrichment":{"title":"אתגר: הרוח, הנהר והסכר","items":[{"type":"text","html":"\u003cp>הנילוס זורם צפונה. הרוח במצרים נושבת בדרך כלל \u003cstrong>מהצפון לדרום\u003c/strong>. ספנים מצרים ניצלו את שני הדברים האלה.\u003c/p>"},{"type":"mcq","prompt":"סירה רוצה להפליג מהדלתא בצפון אל העיר תבאי בדרום. מה כדאי לעשות?","options":["לקפל את המפרש ולתת לזרם לסחוף אותה","לפרוש מפרש ולתת לרוח לדחוף אותה נגד הזרם","אי אפשר להפליג דרומה בנילוס"],"answer":1,"feedback":{"0":"הזרם זורם צפונה – הוא היה לוקח את הסירה בכיוון ההפוך."},"hint":"לאיזה כיוון דוחף הזרם? ולאיזה כיוון דוחפת הרוח?","explain":"הרוח נושבת מצפון לדרום, ולכן בדרך דרומה פורשים מפרש. בדרך חזרה צפונה מקפלים את המפרש ונותנים לזרם לשאת את הסירה."},{"type":"open","prompt":"בשנת 1970 הושלם במצרים סכר אסואן הגבוה, ומאז הנילוס כבר לא מציף את השדות כל שנה. חשבו: מה יצא טוב מזה, ומה הבעיה החדשה שנוצרה לחקלאים?","hint":"חשבו על בתים שנהרסו בהצפות – ועל הבוץ השחור שכבר לא מגיע לשדות.","model":"הטוב: אין יותר הצפות שהורסות כפרים, ואפשר לשמור מים לשנים שחונות. הבעיה: הסחף נעצר מאחורי הסכר ולא מגיע לשדות, ולכן החקלאים צריכים להשתמש בדשנים."}]},"exit":{"prompts":["כתבו במשפט או שניים: למה בלי הנילוס לא הייתה מצרים העתיקה?","מה עדיין לא ברור לכם, או מה הייתם רוצים לשאול על מצרים העתיקה?"],"selfRating":true},"summaryInstruction":"צלמו את המסך הזה בטלפון, או העתיקו למחברת את הציון ואת התשובה הראשונה מכרטיס היציאה. נבדוק יחד בשיעור הבא.","audience":"mixed"}</script>
