ות רק המים הופכים לגז, והמלח נשאר בים. לכן אדי המים – והגשם שנוצר מהם – מתוקים."}]},"exit":{"prompts":["כתבו במשפט אחד: מה ההבדל בין התאדות לעיבוי?","מה עדיין לא ברור לכם, או מה הייתם רוצים לשאול?"],"selfRating":true},"summaryInstruction":"צלמו את המסך הזה ושלחו למורה לפי ההנחיה שקיבלתם, או הראו לה בשיעור הבא.","audience":"mixed"}</script>
